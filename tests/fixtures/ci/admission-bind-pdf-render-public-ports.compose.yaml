# fence-admission-private-bind: target
# GOLDEN FIXTURE — POSITIVE (vector 1: published host-port mapping → fence TRIPS).
#
# SELF-348 A4 item 4c: proves fence-admission-private-bind.sh's inversion coverage
# extends to the pdf-render manifest, not just provider-sync's. A `ports:`
# host-publish mapping on the render-endpoint port makes it reachable from the
# host/public internet. The fence MUST exit 1. Inversion-mode in the
# fence-admission-bind CI job asserts this trips AND asserts the specific
# vector-1 token in the fence's output (Sec F-2 lesson from SELF-350: a
# non-zero exit alone is not proof the right vector fired) — a clean result, or
# a non-zero exit for the wrong reason, fails the job closed.

services:
  pdf-render:
    container_name: pdf-render
    build: .
    restart: unless-stopped
    # VIOLATION: published host-port mapping (should be `expose:` only, as in
    # the real workers/pdf-render/docker-compose.yaml). Port matches the real
    # manifest's 8080 (Sec F-15 fixed a stale 8082 there 2026-09-05).
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PDF_WORKER_SIGNING_KEY=${PDF_WORKER_SIGNING_KEY}
