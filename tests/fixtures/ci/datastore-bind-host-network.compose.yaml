# the project Docker network and the expose:/ports: distinction entirely.
# Exercised by the fence-datastore-bind CI job, asserting exit 1 AND the
# vector-3 token.

services:
  supavisor:
    container_name: supabase-pooler
    image: supabase/supavisor:2.9.12
