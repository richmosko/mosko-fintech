# Minimal fixture manifest for scripts/ci/fence-push-secrets-strikes.sh --
# NOT the real secrets-manifest.yml (that file's own prose/citations are
# irrelevant to this fence; only the `production_only` NAME LIST shape
# matters to push-production-secrets.sh's plan-builder). Mirrors the real
# file's 20-name production_only set (9 SECRET_RESOURCE_MAP-mapped names +
# 10 EXCLUDED_SUPABASE_STACK + 1 EXCLUDED_DEFERRED) minus PLAID_CLIENT_ID/
# PLAID_SECRET (Sec preference, PR #840 review: fixture names should avoid
# the PLAID_ prefix unless a leg genuinely needs it -- none of this
# fence's 6 legs reads either value) so the exclusion-set cross-check in
# push-production-secrets.sh's own plan builder has something real to
# check against, at 18 names.
