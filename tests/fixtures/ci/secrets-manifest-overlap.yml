# GOLDEN VIOLATION FIXTURE — secrets-manifest non-overlap fence (inversion-mode).
#
# This manifest INTENTIONALLY violates the non-overlap invariant: PLAID_CLIENT_ID
# and PDF_WORKER_SIGNING_KEY appear in BOTH ci_only and production_only. The
# `secrets-nonoverlap` CI job runs check-secrets-nonoverlap.py against this file
# and asserts it exits NON-ZERO. If the fence ever reports this fixture clean, the
# fence is broken and CI fails closed (mirrors the RT-22 / RT-26 / TBC
# inversion-mode pattern in security-scan.yml).
#
# DO NOT "fix" this overlap — the violation is the point. This file is NOT a real
# secret store; the names are placeholders proving the catch criterion.

version: 1

ci_only:
  - PLAID_CLIENT_ID              # OVERLAP (also in production_only) — must be caught
  - PLAID_SANDBOX_SECRET
  - PDF_WORKER_SIGNING_KEY       # OVERLAP (also in production_only) — must be caught

production_only:
  - SUPABASE_SERVICE_ROLE_KEY
  - PLAID_CLIENT_ID              # OVERLAP
  - PDF_WORKER_SIGNING_KEY       # OVERLAP
  - PFIN_DB_PASSWORD
