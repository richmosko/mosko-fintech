# Trimmed self-hosted Supabase stack for V1 stand-up (docs/deployment-runbook.md §4).
#
# Derived from Supabase's own reference self-hosting compose, NOT committed verbatim
# per §4's own guidance (the reference's service set and image tags move). Source and
# read time recorded here so a future re-pull can diff against a known point:
#
#   Source:  https://raw.githubusercontent.com/supabase/supabase/master/docker/docker-compose.yml
#   Read:    2026-09-10 07:22 UTC
#   Pinned to upstream commit: 8c7a4d9dbbaf8b552893822e89d7bf06f33f9220
#            ("chore(self-hosted): update 2026-09-09 - 0.8.1 (#50172)")
#
# Trim (§4 service-scope table): IN = db, auth, rest, api-gw (gateway), supavisor.
# OUT = studio, meta, storage, imgproxy, realtime, analytics, vector, functions.
#
# Six changes from the corresponding upstream service blocks, all load-bearing:
#
#   1. api-gw's `depends_on: studio: condition: service_healthy` REMOVED.
#      studio is OUT of this trim; left in place, `docker compose up` hard-errors
#      on the undefined service reference and the gateway never starts.
#
#   2. auth's GOTRUE_DISABLE_SIGNUP is HARDCODED "true", not read from a
#      ${DISABLE_SIGNUP} interpolation. §4 step 5a (F/CTO Q5 ruling) makes
#      signup-disabled a STANDING GATE, not an operator-settable value: it stays
#      off through the full V1.final soak until the Plaid Link-token operator
#      allowlist ships (BACKLOG.md §7.36 item 1). The env-var form was a live
#      defect — the runbook instructed setting a Coolify var named
#      GOTRUE_DISABLE_SIGNUP, but the compose interpolates ${DISABLE_SIGNUP};
#      followed literally, the mismatch resolves empty and signup stays ENABLED,
#      the exact inverse of the ruling. Hardcoding closes it by construction:
#      lifting the gate later requires an edit to this file (and a PR), which is
#      the correct friction for a one-way-door security control, not a Coolify
#      env-var toggle anyone with dashboard access could flip.
#
#   3. Relative bind-mount sources are left COMPOSE-FILE-RELATIVE (./volumes/...),
#      matching upstream, ON CONDITION that this Coolify resource is created with
#      base_directory = /infra/supabase and docker_compose_location = /docker-compose.yml
#      — NOT base_directory = / with docker_compose_location = /infra/supabase/docker-compose.yml,
#      which looks equivalent and is not. Source-verified (team-lead read
#      Coolify's ApplicationDeploymentJob.php:791-793): the deploy job runs
#      `docker compose --project-name {uuid} --project-directory {workdir}
#      -f {workdir}{docker_compose_location} ...`, where `workdir` is the
#      checkout root ADJUSTED BY base_directory — and Compose resolves every
#      relative bind mount against --project-directory, not against the
#      compose file's own location. With base_directory at the repo root,
#      `workdir` is the checkout root and every `./volumes/...` mount below
#      would resolve to `<checkout-root>/volumes/...`, WHICH DOES NOT EXIST.
#      ⚠ THE FAILURE MODE IS SILENT: Docker does not error on a missing
#      bind-mount source — it auto-creates it as an EMPTY DIRECTORY. The stack
#      reports "healthy" while `db` has no roles.sql/jwt.sql/any init script
#      and `api-gw` has an empty /etc/envoy. Setting base_directory to
#      /infra/supabase makes `workdir` == this directory, so `./volumes/...`
#      resolves correctly. VERIFY AT FIRST DEPLOY ANYWAY, because a healthy
#      status cannot distinguish this from success: check the gateway
#      container's own log for a real config load (not just "container
#      running"), and check the db container's boot log for each init-script
#      filename actually executing — see §4's verification step.
#
#   4. `db`'s data directory is a NAMED VOLUME (`db-data`), not upstream's
#      relative bind mount (./volumes/db/data). Multiple Coolify sources
#      converge on this independently of point 3's path-resolution question:
#      a bind mount under the application's git checkout is not guaranteed to
#      survive a redeploy (the checkout can be cleared/re-cloned), whereas a
#      named volume is managed by Docker/Coolify directly and does. Upstream's
#      own compose is written for a manually-run, never-re-cloned checkout,
#      where this distinction doesn't matter — it does here. This is the one
#      change of the four that is correct regardless of how point 3 resolves.
#
#   5. supavisor's pooler-config mount is `:ro`, not upstream's two-flag `:ro,z`.
#      Discovered on the first live deploy attempt: Coolify's compose-string
#      parser mis-reads the two-flag combo into `mount_path` itself
#      (`/etc/pooler/pooler.exs:ro,z` instead of `/etc/pooler/pooler.exs`) —
#      single-flag forms (`:ro` alone, `:Z` alone, used on all seven `db`
#      mounts) parse cleanly. Dropping `:z` costs nothing: this box runs
#      Ubuntu with no SELinux, where `:z` is a no-op regardless.
#
#   6. api-gw and supavisor are `expose:`-only — no published `ports:`.
#      Discovered on the first live deploy attempt: api-gw's upstream
#      `ports: - 8000:8000` collides with Coolify's OWN dashboard on the
#      same host port ("port is already allocated" — api-gw never started),
#      and supavisor's upstream `ports:` would put a multi-tenant Postgres's
#      wire protocol and pooler proxy directly on the host's public
#      interface with only the Hetzner cloud firewall standing in the way.
#      Matches this repo's existing precedent (workers/provider-sync,
#      workers/pdf-render): internal-only services are `expose:`-only, never
#      published, by construction. `app` and `workers/*` reach these two
#      services over the shared Coolify project network by service name
#      once `connect_to_docker_network` is enabled at §6.

# fence-datastore-private-bind: target
# Do not remove the line above (must stand alone, no trailing text): it is
# what lets scripts/ci/fence-datastore-private-bind.sh confirm it is scanning
# the intended datastore manifest rather than silently passing over a
# renamed/unmarked file.
name: supabase

services:

  # Envoy is the default API gateway (upstream renamed this from `kong`;
  # network aliases below keep both hostnames resolvable, though nothing in
  # this tree references either name directly — confirmed via a repo grep).
  api-gw:
    container_name: supabase-envoy
    image: envoyproxy/envoy:v1.39.1
    restart: unless-stopped
    networks:
      default:
        aliases:
          - envoy
          - kong
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 3
    # INTERNAL-ONLY gateway port. `expose:` = reachable to sibling containers
    # on the project network; NOT host-published. Host port 8000 collides
    # with Coolify's own dashboard (observed live, 2026-09-10: `api-gw`
    # failed to start with "port is already allocated"), and publishing it
    # would put the Data API gateway on the public interface with only the
    # Hetzner cloud firewall standing between it and the internet. `app`
    # reaches this service over the shared Coolify project network by
    # service name (`http://api-gw:8000`) once `connect_to_docker_network`
    # is enabled on both resources at §6 — see docs/deployment-runbook.md
    # §4 (1c). NEVER convert this to a `ports:` mapping.
    expose:
      - "8000"
    volumes:
      - ./volumes/api/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./volumes/api/envoy/cds.yaml:/etc/envoy/cds.yaml:ro
      - ./volumes/api/envoy/lds.template.yaml:/etc/envoy/lds.template.yaml:ro
      - ./volumes/api/envoy/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      ANON_KEY_ASYMMETRIC: ${ANON_KEY_ASYMMETRIC:-}
      SERVICE_ROLE_KEY_ASYMMETRIC: ${SERVICE_ROLE_KEY_ASYMMETRIC:-}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]

  auth:
    container_name: supabase-auth
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      # HARDCODED — see header note. Not a ${DISABLE_SIGNUP} interpolation on
      # purpose: this is a standing gate (F/CTO Q5), not an operator tunable.
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE}
      GOTRUE_EXTERNAL_PHONE_ENABLED: ${ENABLE_PHONE_SIGNUP}
      GOTRUE_SMS_AUTOCONFIRM: ${ENABLE_PHONE_AUTOCONFIRM}

  rest:
    container_name: supabase-rest
    image: postgrest/postgrest:v14.17
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_JWKS:-${JWT_SECRET}}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    command: ["postgrest"]

  # Comment out everything below if you are using an external Postgres database
  # (not applicable here — this IS the database).
  db:
    container_name: supabase-db
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    volumes:
      - ./volumes/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:Z
      - ./volumes/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:Z
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      # NAMED VOLUME, not a bind mount — see header note point 4. Upstream uses
      # ./volumes/db/data here; that is unsafe under Coolify's redeploy model.
      - db-data:/var/lib/postgresql/data:Z
      - ./volumes/db/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:Z
      - ./volumes/db/logs.sql:/docker-entrypoint-initdb.d/migrations/99-logs.sql:Z
      - ./volumes/db/pooler.sql:/docker-entrypoint-initdb.d/migrations/99-pooler.sql:Z
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "log_min_messages=fatal" # prevents Realtime polling queries from appearing in logs (harmless: no realtime container in this trim)
      ]

  # Update the DATABASE_URL if you are using an external Postgres database
  # (not applicable here).
  supavisor:
    container_name: supabase-pooler
    image: supabase/supavisor:2.9.12
    restart: unless-stopped
    # INTERNAL-ONLY pooler ports (Postgres wire protocol + transaction-mode
    # pooler proxy). `expose:` = reachable to sibling containers on the
    # project network; NOT host-published. Publishing 5432/6543 would put a
    # multi-tenant Postgres directly on the public interface with only the
    # Hetzner cloud firewall standing in the way (observed live, 2026-09-10:
    # both ports came up bound to 0.0.0.0 — unreachable only because the
    # firewall happened to filter them, not by design). `app` and the
    # `workers/*` services reach this service over the shared Coolify
    # project network by service name once `connect_to_docker_network` is
    # enabled at §6 — see docs/deployment-runbook.md §4 (1c). NEVER convert
    # this to a `ports:` mapping.
    expose:
      - "5432"
      - "6543"
    volumes:
      - ./volumes/pooler/pooler.exs:/etc/pooler/pooler.exs:ro
    healthcheck:
      test: ["CMD", "curl", "-sSfL", "--head", "-o", "/dev/null", "http://127.0.0.1:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: ecto://supabase_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/_supabase
      CLUSTER_POSTGRES: "true"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      VAULT_ENC_KEY: ${VAULT_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      REGION: local
      ERL_AFLAGS: -proto_dist inet_tcp
      POOLER_TENANT_ID: ${POOLER_TENANT_ID}
      POOLER_DEFAULT_POOL_SIZE: ${POOLER_DEFAULT_POOL_SIZE}
      POOLER_MAX_CLIENT_CONN: ${POOLER_MAX_CLIENT_CONN}
      POOLER_POOL_MODE: transaction
      DB_POOL_SIZE: ${POOLER_DB_POOL_SIZE}
    command:
      [
        "/bin/sh",
        "-c",
        "/app/bin/migrate && /app/bin/supavisor eval \"$$(cat /etc/pooler/pooler.exs)\" && /app/bin/server"
      ]

volumes:
  db-config:
  db-data:
  # NOTE: upstream's `deno-cache` volume dropped — it was `functions`-only,
  # and `functions` is OUT of this trim.
