# .github/workflows/security-scan.yml
#
# Phase 5 Step 4 W1 — CI fences + dep/secrets scanners for mosko-fintech V1.
#
# Lock anchors:
#   - ARCH §6 Security scan stage (i)+(ii)+(iii)+(iv)+(v) + ARCH §6.1 catalog mapping
#   - SECURITY §4.5 RT-22 + RT-26 entries
#   - ADR-011 Decision 4 (RT-22 first + RT-26 second catalogued §10 instances)
#   - ADR-011 Decision 17 / Lock 13 mod #2 (RT-22) + mod #3 (TBC; NOT a catalogued §10 instance)
#   - ADR-015 D1 (5 SvelteKit globs frame RT-26 audit-scope structure)
#   - ADR-016 D1 (3 V1 RT-26 allowlist surfaces) + D2 (durably-ratified addition convention)
#
# §10 attribution discipline (per Sec rubric (c)1 verbatim):
#   - RT-22 is the FIRST catalogued §10 instance per ADR-011 Decision 4.
#   - RT-26 is the SECOND catalogued §10 instance per ADR-011 Decision 4.
#   - TBC is the Privileged-context-surfaces bullet at Decision 4 (code-layer
#     parallel to RT-26; NOT in Decision 4's catalogued numbered list).
#     V1-SHIP-BLOCK axis per Lock 13 mod #3 is orthogonal to the §10 catalogued-
#     instance axis. This file is the ENFORCEMENT VENUE for these mechanisms;
#     it is NOT a §10 attribution surface.
#
# Single-repo posture (per ADR-019, Phase 5 Step 4 W0):
#   - pfin_back_etl source is absorbed into this monorepo at workers/etl/; the
#     cross-repo paired-PR pattern retires.
#   - The TBC fence runs production-mode (workers/etl/src/) + inversion-mode
#     (golden fixture) in one job, mirroring fence-rt22's dual-mode shape.

name: Security scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]  # also runs on main to catch direct-push regressions if branch protection ever lapses

# No `paths:` filter — all fences + scanners run on every PR/push per agent-def
# "fail-closed CI fence discipline" defining-behavior. A refactor that moves a
# Dockerfile or adds a sibling shouldn't accidentally skip the fence.

jobs:
  fence-rt22:
    name: RT-22 — PDF worker Dockerfile audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: RT-22 production-mode (PDF worker Dockerfile)
        run: bash scripts/ci/fence-rt22-pdf-worker-dockerfile.sh workers/pdf-render/Dockerfile

      - name: RT-22 inversion-mode (golden fixture; expects violation)
        run: |
          set +e
          bash scripts/ci/fence-rt22-pdf-worker-dockerfile.sh tests/fixtures/ci/rt22-violation.Dockerfile
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            echo "FATAL: RT-22 fence reported clean against violation fixture — fence is broken; failing closed."
            exit 1
          fi
          echo "OK: RT-22 fence caught fixture violation (exit $rc)."

  fence-rt26:
    name: RT-26 — SUPABASE_SERVICE_ROLE_KEY allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: RT-26 production-mode (api/src/ tree)
        # Audit scope = api/src/ tree.
        # The SvelteKit app is scaffolded under api/ (SELF-185), so the server
        # source lives at api/src/ — NOT repo-root src/. SELF-181 (first server
        # surface, hooks.server.ts) is the moment this step becomes load-bearing;
        # the allowlist entries carry the api/ prefix to match (see rt26-allowlist.txt).
        # When/if SvelteKit config files (vite.config.*, svelte.config.js) that
        # reference the key land under api/, add additional invocations here scoping
        # each file; per ARCH §4.1 anything outside the allowlist registry trips the
        # fence — that's by-design when they land.
        run: |
          if [ -d api/src ]; then
            bash scripts/ci/fence-rt26-service-role-allowlist.sh api/src/ scripts/ci/rt26-allowlist.txt
          else
            echo "INFO: api/src/ does not yet exist (pre-SvelteKit-init); RT-26 production-mode scope is empty."
            echo "INFO: This step becomes load-bearing at first SvelteKit commit; fence will scan api/src/ then."
          fi

      - name: RT-26 inversion-mode (golden fixture; expects violation)
        run: |
          set +e
          bash scripts/ci/fence-rt26-service-role-allowlist.sh tests/fixtures/ci/rt26-violation/ scripts/ci/rt26-allowlist.txt
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            echo "FATAL: RT-26 fence reported clean against violation fixture — fence is broken; failing closed."
            exit 1
          fi
          echo "OK: RT-26 fence caught fixture violation (exit $rc)."

  fence-tbc:
    name: TBC — TenantBoundConnection grep (production + inversion)
    runs-on: ubuntu-latest
    # Post-W0 (ADR-019): pfin_back_etl source is absorbed into this monorepo at
    # workers/etl/. The cross-repo paired-PR pattern retires; production-mode +
    # inversion-mode both run here, mirroring the fence-rt22 dual-mode shape.
    # Production-mode scopes to workers/etl/src/ — the faithful 1:1 migration of
    # the pre-W0 pfin_back_etl CI posture, which scanned src/ and excluded tests/
    # (where the violation fixture lives; it is exercised under inversion-mode).
    steps:
      - uses: actions/checkout@v4

      - name: TBC production-mode (workers/etl/src/ source tree)
        run: bash scripts/ci/fence-tbc-pfin-back-etl.sh workers/etl/src/

      - name: TBC inversion-mode (golden fixture; expects violation)
        run: |
          # --allow-missing-class: the fixture tree has no TenantBoundConnection
          # class by design. Without the flag, class-absence would fail closed
          # (exit 2) and MASK whether the pattern set actually matched the
          # fixture's deliberate violations — defeating the inversion test's
          # purpose. With the flag, the fence proceeds to the grep stage and must
          # exit 1 on the fixture's create_engine()/connect() violations.
          set +e
          # Target the golden fixture FILE specifically (not the tests/fixtures/ci/
          # dir). The dir now also contains tbc-basename-collision/db/core.py, which
          # DECLARES class TenantBoundConnection — sweeping the whole dir would let
          # inversion discover that class and muddy the "no class by design"
          # semantics. File-targeting keeps inversion precise and mirrors the Node
          # fence's inversion step. (The collision dir is exercised by its own
          # production-mode regression step below.)
          bash scripts/ci/fence-tbc-pfin-back-etl.sh --allow-missing-class tests/fixtures/ci/tbc-violation.py
          rc=$?
          set -e
          if [ $rc -ne 1 ]; then
            echo "FATAL: TBC inversion expected exit 1 (violations caught) but got exit $rc — fence is broken; failing closed."
            exit 1
          fi
          echo "OK: TBC fence caught fixture violation (exit $rc)."

      - name: TBC same-basename-collision regression (class present; expects violator caught)
        # Python-parity regression test for the grep --exclude=<basename> false-negative
        # (Sec, 2026-07-17): class at db/core.py + violator at etl/core.py (SAME basename).
        # Run in PRODUCTION mode (class present → NO --allow-missing-class); the fence MUST
        # exit 1 by catching the violator via full-path exclusion. Exit 0 = regression.
        run: |
          set +e
          bash scripts/ci/fence-tbc-pfin-back-etl.sh tests/fixtures/ci/tbc-basename-collision/
          rc=$?
          set -e
          if [ $rc -ne 1 ]; then
            echo "FATAL: same-basename collision expected exit 1 (violator caught) but got exit $rc — basename false-negative regressed; failing closed."
            exit 1
          fi
          echo "OK: TBC fence caught the same-basename violator (exit $rc)."

  fence-tbc-node:
    name: TBC-node — TenantBoundClient grep (production + inversion)
    runs-on: ubuntu-latest
    # ADR-019 amendment (F/CTO-ratified 2026-07-17): the Node/TS provider-sync
    # worker (workers/provider-sync/) is the FIRST DB-touching Node worker. It needs
    # a Node TenantBoundConnection-equivalent (TenantBoundClient) enforced fail-closed
    # BEFORE any DB-touching worker code merges. This job is the Node analogue of
    # fence-tbc; the Python patterns don't match TS, so it is a SEPARATE fence.
    # Production-mode scopes to workers/provider-sync/src/; inversion-mode runs the
    # golden fixture (tests/fixtures/ci/tbc-node-violation.ts), mirroring fence-tbc's
    # dual-mode shape. See scripts/ci/fence-tbc-node.sh SANCTIONED-TRANSPORT CONTRACT.
    steps:
      - uses: actions/checkout@v4

      - name: TBC-node production-mode (workers/provider-sync/src/ source tree)
        # Scaffold posture: the worker source tree does not exist until Backend lands
        # the implementation (task #12 / SELF-197+). Until then this step no-ops (the
        # container Dockerfile + fence + fixture ship ahead of the app code). It
        # becomes load-bearing at the first workers/provider-sync/src/ commit, where
        # the fence fails closed if TenantBoundClient is absent (no --allow-missing-class).
        run: |
          if [ -d workers/provider-sync/src ]; then
            bash scripts/ci/fence-tbc-node.sh workers/provider-sync/src/
          else
            echo "INFO: workers/provider-sync/src/ does not yet exist (pre-implementation scaffold)."
            echo "INFO: TBC-node production-mode scope is empty; becomes load-bearing at first worker-source commit."
          fi

      - name: TBC-node inversion-mode (golden fixture; expects violation)
        run: |
          # --allow-missing-class: the fixture tree has no TenantBoundClient class by
          # design. Without the flag, class-absence would fail closed (exit 2) and
          # MASK whether the pattern set actually matched the fixture's deliberate
          # violations. With the flag, the fence proceeds to grep and must exit 1 on
          # the fixture's LEG 1 (postgres()/new Pool()/new Client()/@supabase import/
          # createClient()) + LEG 2 (SUPABASE_SERVICE_ROLE_KEY absence tripwire) violations.
          set +e
          bash scripts/ci/fence-tbc-node.sh --allow-missing-class tests/fixtures/ci/tbc-node-violation.ts
          rc=$?
          set -e
          if [ $rc -ne 1 ]; then
            echo "FATAL: TBC-node inversion expected exit 1 (violations caught) but got exit $rc — fence is broken; failing closed."
            exit 1
          fi
          echo "OK: TBC-node fence caught fixture violation (exit $rc)."

      - name: TBC-node same-basename-collision regression (class present; expects violator caught)
        # Regression test for the grep --exclude=<basename> false-negative (Sec, 2026-07-17):
        # class at db/client.ts + violator at adapters/client.ts (SAME basename). Run in
        # PRODUCTION mode (class present → NO --allow-missing-class); the fence MUST exit 1
        # by catching the violator via full-path exclusion. Exit 0 = the false-negative regressed.
        run: |
          set +e
          bash scripts/ci/fence-tbc-node.sh tests/fixtures/ci/tbc-node-basename-collision/
          rc=$?
          set -e
          if [ $rc -ne 1 ]; then
            echo "FATAL: same-basename collision expected exit 1 (violator caught) but got exit $rc — basename false-negative regressed; failing closed."
            exit 1
          fi
          echo "OK: TBC-node fence caught the same-basename violator (exit $rc)."

  scanner-npm-audit:
    name: Dep scan — npm audit (high+critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm audit (fails on high or critical)
        run: |
          set -euo pipefail
          # Enumerate package.json files under V1 scope (V1 web-app + PDF worker;
          # both Node). Skip if none land yet — pre-SvelteKit-init posture.
          #
          # ENUMERATOR RATIONALE — `git ls-files`, not `find`:
          #   The previous `find . -name 'package.json' -not -path './node_modules/*'`
          #   pruned only the ROOT node_modules; './api/node_modules/*' and
          #   './workers/provider-sync/node_modules/*' were not excluded. On a fresh
          #   CI checkout there is no node_modules, so the job behaved correctly and
          #   the bug was invisible. On any warm workspace it is not close: measured
          #   on a tree with deps installed, that pattern enumerated 314 paths
          #   against an intended 3 — it would have audited every vendored
          #   dependency's own package.json. That also made the job impossible to
          #   reproduce locally, which is how a CI fence stops being checkable.
          #
          #   `git ls-files` returns exactly the TRACKED files. It cannot see
          #   node_modules at any depth (gitignored), so the whole class of
          #   nested-prune bugs is removed rather than one instance patched. The
          #   checkout is a git repo, so this is available at zero cost.
          PKG_FILES=$(git ls-files '*package.json' 'package.json' | grep -v '^tests/' || true)
          if [ -z "$PKG_FILES" ]; then
            echo "INFO: no package.json under mosko-fintech V1 scope — npm audit no-op as expected at W1."
            echo "INFO: This scanner becomes load-bearing at first npm-init commit."
            exit 0
          fi
          echo "Enumerated $(printf '%s\n' "$PKG_FILES" | wc -l | tr -d ' ') package.json file(s):"
          printf '  %s\n' $PKG_FILES

          # INVERSION CHECK — proves the enumerator ignores vendored manifests.
          # Without this, a future refactor back to a `find` could silently restore
          # the 314-vs-3 behavior and every audit would still exit 0 on a cold
          # runner, so the regression would ship unseen. Plant a package.json inside
          # a nested node_modules and assert it is NOT enumerated; fail closed if it
          # is. Cleaned up before the real audit runs.
          mkdir -p api/node_modules/__fence_probe__
          echo '{"name":"fence-probe","version":"1.0.0"}' > api/node_modules/__fence_probe__/package.json
          PROBE=$(git ls-files '*package.json' 'package.json' | grep -v '^tests/' || true)
          rm -rf api/node_modules/__fence_probe__
          if printf '%s\n' "$PROBE" | grep -q '__fence_probe__'; then
            echo "FATAL: enumerator picked up a vendored node_modules manifest — nested-prune regression; failing closed."
            exit 1
          fi
          echo "OK: enumerator ignored the planted node_modules manifest."

          for p in $PKG_FILES; do
            d=$(dirname "$p")
            echo "Auditing $d"
            (cd "$d" && npm audit --audit-level=high)
          done

  scanner-pip-audit:
    name: Dep scan — pip-audit (high+critical)
    runs-on: ubuntu-latest
    # V1 web-app + PDF worker are Node-only at V1; this requirements*.txt-based job
    # no-ops in the monorepo as expected. Post-W0 (ADR-019) the ETL source lives at
    # workers/etl/ but pins deps via pyproject.toml + uv.lock (NOT requirements*.txt),
    # so it is NOT covered by this find pattern — adding uv/pyproject-aware Python
    # dep-audit for workers/etl/ is tracked with the ETL CI re-homing follow-up.
    # When/if a requirements*.txt surface lands, pip-audit picks it up automatically.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: pip-audit (defensive find excludes fixtures + node_modules)
        run: |
          pip install pip-audit
          REQS=$(find . -name 'requirements*.txt' -not -path './node_modules/*' -not -path './tests/*' || true)
          if [ -z "$REQS" ]; then
            echo "INFO: no requirements*.txt under mosko-fintech V1 scope — pip-audit no-op as expected."
            echo "INFO: workers/etl/ pins deps via pyproject.toml + uv.lock (not requirements*.txt); uv/pyproject-aware ETL dep-audit is a tracked follow-up."
            exit 0
          fi
          for r in $REQS; do
            echo "Auditing $r"
            pip-audit -r "$r"
          done

  scanner-gitleaks:
    name: Secrets scan — gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs full history for diff mode

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # GITHUB_TOKEN is auto-provided by GitHub Actions to every workflow run;
          # gitleaks-action v2 requires it for PR scanning (per the action's README
          # breaking-change announcement). No secrets-manifest entry required —
          # GITHUB_TOKEN is GitHub-native, NOT a CI-only project secret.
          #
          # GITLEAKS_LICENSE intentionally NOT set — richmosko is an individual GitHub
          # user (not an organization); gitleaks-action requires a license key only
          # for org-owned private repos. If/when mosko-fintech ever migrates to an
          # org owner, surface the license-key requirement to the secrets-manifest
          # work at Phase 5 Step 8.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  secrets-nonoverlap:
    name: Secrets manifest — CI/production non-overlap
    runs-on: ubuntu-latest
    # Phase 5 Step 8 (DevOps-led; Sec-consult mandatory at manifest lock).
    # Enforces the secrets-manifest.yml invariant: ci_only and production_only are
    # DISJOINT name-sets — a leaked CI secret must never grant production access.
    # Dual-mode (production + inversion), mirroring the fence-rt22/rt26/tbc shape.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Non-overlap check — production-mode (real manifest; expects clean)
        run: python3 scripts/ci/check-secrets-nonoverlap.py secrets-manifest.yml

      - name: Non-overlap check — inversion-mode (golden fixture; expects violation)
        run: |
          set +e
          python3 scripts/ci/check-secrets-nonoverlap.py tests/fixtures/ci/secrets-manifest-overlap.yml
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            echo "FATAL: non-overlap fence reported clean against the overlap fixture — fence is broken; failing closed."
            exit 1
          fi
          echo "OK: non-overlap fence caught fixture violation (exit $rc)."

  fence-admission-bind:
    name: RT-27 — admission endpoint private-bind config-lint
    runs-on: ubuntu-latest
    # SELF-212 Option-C C6-1 limb (b): committed-config lint over the provider-sync
    # Coolify Compose manifest — the admission endpoint must stay INTERNAL-ONLY
    # (expose:-only; no host-publish; no public Domain / Traefik Host() label; no
    # network_mode: host). RT-27's §10-catalogued network-exposure layer — the THIRD
    # catalogued §10 instance (RT-22 first / RT-26 second / RT-27 third) per Sec CA-3.
    #
    # HOMED HERE (run-always, no paths filter) per Sec F-2 (code-half review, RT-27
    # fence owner): a §10-catalogued instance must be run-always like RT-22/RT-26 —
    # a path-trigger leaves a trigger-drift meta-risk (a future `paths:` refactor
    # silently disabling the fence). Dual-mode (production + inversion) with a golden
    # fixture per exposure vector, mirroring fence-rt22/rt26/tbc/secrets-nonoverlap.
    steps:
      - uses: actions/checkout@v4

      - name: Production-mode — real compose (expects internal-only; exit 0)
        run: bash scripts/ci/fence-admission-private-bind.sh workers/provider-sync/docker-compose.yaml

      - name: Inversion — negative control fixture (correct config; expects exit 0)
        run: bash scripts/ci/fence-admission-private-bind.sh tests/fixtures/ci/admission-bind-private.compose.yaml

      - name: "Inversion — golden 1: published ports (expects violation, exit 1)"
        run: |
          set +e
          bash scripts/ci/fence-admission-private-bind.sh tests/fixtures/ci/admission-bind-public-ports.compose.yaml
          rc=$?
          set -e
          if [ $rc -ne 1 ]; then
            echo "FATAL: admission-bind fence expected exit 1 on the published-ports golden but got $rc — fence is broken; failing closed."
            exit 1
          fi
          echo "OK: fence caught the published-ports exposure vector (exit $rc)."

      - name: "Inversion — golden 2: proxy Domain / Host() label (expects violation, exit 1)"
        run: |
          set +e
          bash scripts/ci/fence-admission-private-bind.sh tests/fixtures/ci/admission-bind-public-domain.compose.yaml
          rc=$?
          set -e
          if [ $rc -ne 1 ]; then
            echo "FATAL: admission-bind fence expected exit 1 on the proxy-Domain golden but got $rc — fence is broken; failing closed."
            exit 1
          fi
          echo "OK: fence caught the proxy-Domain exposure vector (exit $rc)."

      - name: "Inversion — golden 3: host-network mode (expects violation, exit 1)"
        run: |
          set +e
          bash scripts/ci/fence-admission-private-bind.sh tests/fixtures/ci/admission-bind-host-network.compose.yaml
          rc=$?
          set -e
          if [ $rc -ne 1 ]; then
            echo "FATAL: admission-bind fence expected exit 1 on the host-network golden but got $rc — fence is broken; failing closed."
            exit 1
          fi
          echo "OK: fence caught the host-network exposure vector (exit $rc)."

  dedup-hash-identical:
    name: dedup-hash — import_hash canonical↔copy drift fence
    runs-on: ubuntu-latest
    # SELF-204 / ADR-034 Decision 4 (F/CTO-ratified 2026-07-27): the canonical manual↔
    # provider import_hash is ONE shared source (workers/provider-sync/src/shared/
    # importHash.ts) with a machine-generated, banner-marked copy (api/src/lib/server/
    # dedup/importHash.ts). A divergent canonicalization breaks manual↔provider dedup
    # detection INVISIBLY and imprints on stored hashes (one-way door) — so the two must
    # be provably identical at every merge.
    #
    # Mechanism = REGENERATE-and-assert-clean (Sec ratify condition 2, 2026-07-27), NOT a
    # static two-file byte-compare (which passes if both were hand-edited in lockstep). The
    # script runs the canonical generator from the source and asserts the committed copy IS
    # that fresh output — red on stale/hand-edited/deleted copy. See the script header for
    # the `--stdout | diff` vs `git diff --exit-code` mechanism note flagged to Sec.
    #
    # HOMED HERE (run-always, no `paths:` filter) DELIBERATELY: this is a CROSS-TREE fence
    # (workers/provider-sync/ ↔ api/). Path-filtering it to either tree would green-by-
    # absence when a PR edits only the OTHER tree — the exact F-2 / RT-27 trigger-drift hole.
    # A drift fence that isn't run-always is theater. Must ALSO be a REQUIRED status check on
    # `main` (F/CTO branch-protection action, registrable after this job's first report).
    # Dual-mode (production + inversion golden) mirrors fence-rt22/rt26/tbc/secrets-nonoverlap.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'  # generator is a Node .mjs; matches both tiers' runtime

      - name: Production-mode — real canonical source vs committed copy (expects clean, exit 0)
        run: bash scripts/ci/check-dedup-hash-identical.sh

      - name: Inversion — golden diverged copy (expects drift, exit 1)
        run: |
          set +e
          bash scripts/ci/check-dedup-hash-identical.sh \
            --source tests/fixtures/ci/dedup-hash-drift-source.ts \
            --copy   tests/fixtures/ci/dedup-hash-drift-copy.ts
          rc=$?
          set -e
          if [ $rc -ne 1 ]; then
            echo "FATAL: dedup-hash fence expected exit 1 on the diverged-copy golden but got $rc — fence is broken; failing closed."
            exit 1
          fi
          echo "OK: fence caught the diverged-copy drift (exit $rc)."

  tz-sweep-identical:
    name: tz-sweep — runbook §4.1 ↔ (T3) query drift fence
    runs-on: ubuntu-latest
    # R3 Part A (DevOps-owned; Sec-consult — this fences the sweep Sec reviewed at #324).
    #
    # The TimeZone role-sweep query lives in TWO places and each claims to be kept
    # identical to the other: docs/deployment-runbook.md §4.1 (the operator-facing deploy
    # step) and supabase/tests/01_session_timezone.sql (T3) (the CI assertion). R3's
    # eventual production-gate script would be a THIRD. Prose cannot hold three copies
    # identical — and it did not hold two: the copies HAD already drifted when the claim
    # was written, the runbook copy missing both `s.setrole <> 0` (red-by-construction on
    # a correctly pinned database) and the `unnest` + anchored filter (which printed
    # app.settings.jwt_secret — the LIVE JWT SIGNING SECRET — into deploy logs). Both were
    # found by RUNNING the sweep, not by reading it. This job is the fence that claim
    # needed.
    #
    # NORMALIZES WHITESPACE BEFORE COMPARING, deliberately. The two copies live in
    # structurally different contexts (a shell double-quoted `psql -Atc` argument vs a
    # `$$ … $$` SQL literal) and CANNOT be byte-identical; their indentation differs by
    # construction. The artifacts claim "token-for-token, modulo indentation", and this
    # fence enforces exactly that claim and nothing stronger — a fence asserting more than
    # its artifact promises is a false red, and false reds get fences deleted.
    #
    # NEEDS NO PRODUCTION REACH: it is a text comparison over two committed files. That is
    # what makes it buildable now, independent of whether the R3 production gate is ever
    # ratified.
    #
    # RUN-ALWAYS (no `paths:` filter) DELIBERATELY: this is a CROSS-TREE fence
    # (docs/ ↔ supabase/tests/). Path-filtering it to either tree would green-by-absence
    # when a PR edits only the other — the F-2 / RT-27 trigger-drift hole, and the same
    # reasoning as dedup-hash-identical above. Should ALSO become a REQUIRED status check
    # on `main` (F/CTO branch-protection action, registrable after this job's first report).
    #
    # THREE-MODE inversion, not two. The whitespace-only golden must stay GREEN: a fence
    # proven only to RED has not been shown to red for the RIGHT REASON, and one that reds
    # on a re-indent is indistinguishable from a working one until someone reformats the
    # runbook, gets an unexplainable red, and deletes the job.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # stdlib only — no pip install step needed

      - name: Production-mode — real runbook §4.1 vs real (T3) (expects identical, exit 0)
        run: python3 scripts/ci/check-tz-sweep-identical.py

      - name: Inversion A — semantic drift, missing `s.setrole <> 0` (expects drift, exit 1)
        run: |
          set +e
          python3 scripts/ci/check-tz-sweep-identical.py \
            --runbook tests/fixtures/ci/tz-sweep-drift/semantic-runbook.md \
            --test    tests/fixtures/ci/tz-sweep-drift/semantic-test.sql
          rc=$?
          set -e
          if [ $rc -ne 1 ]; then
            echo "FATAL: tz-sweep fence expected exit 1 on the semantic-drift golden but got $rc — fence is broken; failing closed."
            exit 1
          fi
          echo "OK: fence caught the semantic drift (exit $rc)."

      - name: Inversion B — whitespace-only difference (expects GREEN, exit 0)
        run: |
          set +e
          python3 scripts/ci/check-tz-sweep-identical.py \
            --runbook tests/fixtures/ci/tz-sweep-drift/whitespace-runbook.md \
            --test    tests/fixtures/ci/tz-sweep-drift/whitespace-test.sql
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "FATAL: tz-sweep fence RED on a whitespace-only difference (exit $rc) — the normalization is broken."
            echo "This direction matters as much as the drift catch: a fence that reds on a re-indent will be deleted the first time someone reformats the runbook."
            exit 1
          fi
          echo "OK: fence stayed green through re-indentation (exit $rc) — reds are attributable to semantics, not formatting."

      - name: Extraction guard — a missing anchor must FAIL CLOSED, never green
        run: |
          set +e
          python3 scripts/ci/check-tz-sweep-identical.py \
            --runbook tests/fixtures/ci/tz-sweep-drift/no-anchor-runbook.md \
            --test    supabase/tests/01_session_timezone.sql
          rc=$?
          set -e
          if [ $rc -ne 1 ]; then
            echo "FATAL: tz-sweep fence did not fail closed when the runbook anchor was absent (exit $rc)."
            echo "A fence that cannot locate the thing it compares must never report green — comparing nothing to nothing is the defect class this surface exists to remove."
            exit 1
          fi
          echo "OK: fence failed closed on a missing anchor (exit $rc)."

      - name: Ambiguity guard — two anchor matches must FAIL CLOSED, not silently pick one
        run: |
          set +e
          python3 scripts/ci/check-tz-sweep-identical.py \
            --runbook tests/fixtures/ci/tz-sweep-drift/ambiguous-runbook.md \
            --test    supabase/tests/01_session_timezone.sql
          rc=$?
          set -e
          if [ $rc -ne 1 ]; then
            echo "FATAL: tz-sweep fence did not fail closed on an ambiguous anchor (exit $rc)."
            echo "A fence that silently compares 'the first match' would check the WRONG pair and report green while the guarded property went unexamined."
            exit 1
          fi
          echo "OK: fence refused to guess between two anchor matches (exit $rc)."

  scheduled-audit-liveness:
    name: Scheduled dep audit — liveness (cron not disabled or stalled)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    # A1's companion check. The scheduled unfiltered audit
    # (scheduled-dep-audit.yml) closes a TIME-BASED failure mode — but it has a
    # time-based fail-open of its own, and it is a silent one:
    #
    #   (i)  GitHub documents that "in a public repository, scheduled workflows
    #        are automatically disabled when no repository activity has occurred
    #        in 60 days." This repo is PUBLIC (verified: `gh repo view --json
    #        visibility`), so the rule applies. A remediation for a time-based gap
    #        that is itself switched off by inactivity reproduces the original
    #        failure one level up.
    #   (ii) GitHub also documents that scheduled runs "can be delayed during
    #        periods of high loads" and that "some queued jobs may be dropped".
    #        So a cron can silently skip runs while still enabled.
    #
    # In BOTH cases nothing goes red. A disabled or stalled cron does not fail —
    # it stops existing, and the Actions UI shows an absence, which no one is
    # watching for. "Low risk today" is exactly how the gap this all started with
    # got built, so the disablement is checked rather than assumed away.
    #
    # This job lives here, in the UNFILTERED workflow, on purpose: security-scan.yml
    # has no `paths:` filter, so anything that can disable the cron through
    # inactivity is by definition also stopping this check from running — but the
    # moment activity resumes, the first PR or push re-checks it. Something that
    # still fires when the cron does not has to be the observer; nothing inside the
    # cron can report its own absence.
    #
    # It queries the workflow's `state` DIRECTLY rather than inferring liveness
    # from run history alone — `disabled_inactivity` is an observable fact, not
    # something to deduce from a gap. Run age is checked too, for case (ii).
    #
    # Adds no secret and no integration: GITHUB_TOKEN with `actions: read`.
    # Scoped to a NEW job — it re-scopes no existing fence.
    #
    # ERROR-BRANCH RULE (adopted after Sec's finding on the first cut of this job):
    # every error branch in a fence script exits non-zero unless there is a written
    # reason it cannot. The first version collapsed 404-missing-workflow,
    # 404-missing-repo and 401-bad-credentials into one silent `exit 0`, because it
    # tested only `gh api` failing and discarded stderr. That is the same shape the
    # fence exists to prevent: an absence rendering as a pass. Worse, it was
    # one-directional — once the workflow is registered, "not registered" is
    # impossible, so every later trip down that branch was necessarily false, and it
    # would never have expired on its own. Realistic trigger: this job declares
    # `permissions: actions: read`; tighten that or narrow github.token and the call
    # 403s and this job goes GREEN. A fence that dies quietly when someone hardens
    # permissions fails exactly when it is being taken seriously.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need the workflow file's first-commit date to bound the bootstrap window

      - name: Assert the scheduled audit is active and running
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WF: scheduled-dep-audit.yml
          WF_PATH: .github/workflows/scheduled-dep-audit.yml
          MAX_GAP_DAYS: '3'          # daily cron + slack for documented delays/drops
          FIRST_RUN_GRACE_DAYS: '2'  # after merge, before the first cron fires
        run: |
          set -euo pipefail

          # Returns the HTTP status on stdout and writes the response body to $2.
          # "000" means no HTTP response at all (network failure, gh missing, auth
          # plugin broken) — deliberately a distinct value, never conflated with a
          # real status. stderr is echoed, not discarded: it was discarding stderr
          # that produced the fail-open this guard replaces.
          # Anchored on the status LINE, and the reason phrase is optional. HTTP/2
          # has no reason phrase in the protocol at all — whether a client renders
          # one is its own choice, not a guarantee. An earlier version matched
          # ' [0-9]{3} ' with a REQUIRED trailing space, so `HTTP/2 200` parsed as
          # "000" and FATAL'd a perfectly healthy workflow. That direction is
          # fail-closed, so it was not a security hole — but a fence that goes red
          # for a reason nobody can diagnose is how a fence gets discounted, which
          # costs the same in the end. Guarded by the parser self-test below.
          status_of() {  # $1 = status line
            printf '%s\n' "$1" | grep -oE '^HTTP/[0-9.]+[[:space:]]+[0-9]{3}' \
              | grep -oE '[0-9]{3}$' | head -n 1 || true
          }

          api_call() {
            local raw err code
            raw="$(mktemp)"; err="$(mktemp)"
            set +e; gh api -i "$1" >"$raw" 2>"$err"; set -e
            code="$(status_of "$(head -n 1 "$raw")")"
            if [ -z "$code" ]; then
              code="000"
              sed 's/^/    gh stderr: /' "$err" >&2 || true
            fi
            awk 'b{print} /^\r?$/{b=1}' "$raw" > "$2"
            rm -f "$raw" "$err"
            printf '%s' "$code"
          }

          # ---------------------------------------------------------------------
          # PARSER SELF-TEST — asserts on parsed VALUES, not on exit status.
          #
          # This job has many branches that all exit 1. Against a fail-closed
          # instrument a broken probe produces a false NEGATIVE that is invisible in
          # the probe's own result: every malformed input still fails, so the probe
          # looks like it works. The fence's best property is exactly what hides a
          # broken harness. Asserting "exit 1" would therefore verify nothing here —
          # only the parsed value discriminates.
          #
          # Concretely: if status_of() silently returned "" for every input, every
          # branch below would still FATAL and every exit-code assertion would still
          # pass, while the job had stopped distinguishing 401 from 404 from healthy.
          # ---------------------------------------------------------------------
          selftest_fail=0
          while IFS='|' read -r line want; do
            [ -n "$line" ] || continue
            got="$(status_of "$line")"; got="${got:-000}"
            if [ "$got" != "$want" ]; then
              echo "FATAL: status parser returned '$got' for '$line' (expected '$want')."
              selftest_fail=1
            fi
          done <<'CASES'
          HTTP/2.0 404 Not Found|404
          HTTP/1.1 401 Unauthorized|401
          HTTP/2 403|403
          HTTP/2 200|200
          HTTP/2.0 429 Too Many Requests|429
          garbage with 200 in it|000
          |000
          CASES
          if [ "$selftest_fail" -ne 0 ]; then
            echo "       The status parser cannot tell these apart, so every verdict below"
            echo "       would be unreliable in a way that still LOOKS like a working fence."
            exit 1
          fi
          echo "OK: status parser discriminates all probed status-line forms."

          BODY="$(mktemp)"
          CODE="$(api_call "/repos/$REPO/actions/workflows/$WF" "$BODY")"

          if [ "$CODE" = "404" ]; then
            # A 404 is ambiguous: the workflow may genuinely not be on the default
            # branch yet (the legitimate bootstrap case), OR the repo path/token
            # scope may be wrong — which returns 404, not 403, for a repo the token
            # cannot see. Disambiguate with a second call instead of assuming the
            # benign reading of an ambiguous signal.
            REPO_BODY="$(mktemp)"
            REPO_CODE="$(api_call "/repos/$REPO" "$REPO_BODY")"
            rm -f "$REPO_BODY"
            if [ "$REPO_CODE" != "200" ]; then
              echo "FATAL: workflow lookup returned 404 and the repo itself returned $REPO_CODE."
              echo "       That is not the bootstrap case — the repo is unreachable or the token"
              echo "       cannot see it. Liveness is UNKNOWN, and unknown is not green."
              exit 1
            fi

            # True 404 with a reachable repo. Bounded: if the workflow file has been
            # in the tree longer than the grace window and STILL is not registered,
            # something is wrong with the file, not with the timing.
            FIRST_SEEN="$(git log --format=%cI --reverse -- "$WF_PATH" 2>/dev/null | head -n 1 || true)"
            if [ -z "$FIRST_SEEN" ]; then
              echo "FATAL: $WF is not registered AND $WF_PATH has no commit history here."
              echo "       Cannot bound the bootstrap window, so cannot justify passing."
              exit 1
            fi
            python3 - "$FIRST_SEEN" <<'PY'
          import os, sys
          from datetime import datetime, timezone
          age = (datetime.now(timezone.utc) - datetime.fromisoformat(sys.argv[1])).total_seconds()/86400.0
          grace = float(os.environ["FIRST_RUN_GRACE_DAYS"])
          wf = os.environ["WF"]
          if age > grace:
              print(f"FATAL: {wf} has been in the tree {age:.1f} days (grace {grace}) but is still")
              print( "       not registered on the default branch. Either it never merged or its")
              print( "       filename/location is wrong. The unfiltered audit is NOT running.")
              sys.exit(1)
          print(f"INFO: {wf} not registered yet; file is {age:.1f}d old, within the {grace}d bootstrap")
          print( "INFO: window. GitHub registers a workflow only once it lands on the default")
          print( "INFO: branch. This check becomes load-bearing at merge.")
          PY
            exit 0
          fi

          if [ "$CODE" != "200" ]; then
            echo "FATAL: workflow lookup returned HTTP $CODE (expected 200, or 404 while bootstrapping)."
            case "$CODE" in
              401) echo "       401 — bad or expired credentials." ;;
              403) echo "       403 — token lacks 'actions: read', or rate-limited. NOTE: this job"
                   echo "             declares that permission; if it was tightened, this is why." ;;
              000) echo "       000 — no HTTP response at all: network failure, or gh unavailable." ;;
              *)   echo "       Unexpected status." ;;
            esac
            echo "       Liveness could not be determined. An undetermined check is not a passing"
            echo "       check — this is the one job whose whole purpose is detecting silent absence."
            exit 1
          fi

          # A 200 whose body does not parse, or lacks the field we read, is another
          # UNDETERMINED result — not a pass. Without this it surfaces as a Python
          # traceback: that does fail closed, but a stack trace is not an actionable
          # fence message, and "the fence is broken" must not read like "the cron is
          # fine". Same error-branch rule as everything else in this job.
          assert_json() {  # $1=file $2=required key $3=human description
            python3 - "$1" "$2" "$3" <<'PY'
          import sys, json
          path, key, what = sys.argv[1:4]
          try:
              data = json.load(open(path))
          except Exception as e:
              print(f"FATAL: {what} returned HTTP 200 but its body did not parse as JSON: {e}")
              print( "       Liveness is UNDETERMINED. Undetermined is not green.")
              sys.exit(1)
          if key not in data:
              print(f"FATAL: {what} returned JSON with no '{key}' field — the API shape changed,")
              print( "       or the response is not the one that was requested.")
              sys.exit(1)
          PY
          }

          assert_json "$BODY" state "the workflow lookup"
          STATE=$(python3 -c 'import sys,json; print(json.load(open(sys.argv[1]))["state"])' "$BODY")
          CREATED=$(python3 -c 'import sys,json; print(json.load(open(sys.argv[1]))["created_at"])' "$BODY")
          rm -f "$BODY"

          if [ "$STATE" != "active" ]; then
            echo "FATAL: $WF state is '$STATE', not 'active'."
            echo "       'disabled_inactivity' means GitHub switched it off after 60 days with no"
            echo "       repository activity. 'disabled_manually' means someone turned it off."
            echo "       Either way the unfiltered dependency audit has NOT been running, and its"
            echo "       silence has been reading as 'clean'. Re-enable it in the Actions tab."
            exit 1
          fi

          RUNS_BODY="$(mktemp)"
          RUNS_CODE="$(api_call "/repos/$REPO/actions/workflows/$WF/runs?per_page=1" "$RUNS_BODY")"
          if [ "$RUNS_CODE" != "200" ]; then
            echo "FATAL: run-history lookup returned HTTP $RUNS_CODE. Cannot determine whether the"
            echo "       cron has been firing. Undetermined is not green."
            exit 1
          fi
          assert_json "$RUNS_BODY" workflow_runs "the run-history lookup"
          LAST=$(python3 -c '
          import sys, json
          runs = json.load(open(sys.argv[1])).get("workflow_runs") or []
          print(runs[0]["updated_at"] if runs else "")
          ' "$RUNS_BODY")
          rm -f "$RUNS_BODY"

          # Conclusion-agnostic on purpose: a FAILING scheduled run still proves the
          # cron is alive, and the audit job itself is what reports the advisory.
          # Liveness must not double-report a finding, or a real advisory would show
          # up as two unrelated-looking red checks.
          python3 - "$CREATED" "$LAST" <<'PY'
          import sys, os
          from datetime import datetime, timezone

          _, created, last = sys.argv
          max_gap = float(os.environ["MAX_GAP_DAYS"])
          grace   = float(os.environ["FIRST_RUN_GRACE_DAYS"])
          wf      = os.environ["WF"]
          now     = datetime.now(timezone.utc)

          def age_days(ts):
              return (now - datetime.fromisoformat(ts)).total_seconds() / 86400.0

          if not last:
              a = age_days(created)
              if a > grace:
                  print(f"FATAL: {wf} is active but has NEVER run, and it was")
                  print(f"       registered {a:.1f} days ago (grace {grace}).")
                  print( "       An active cron that never fires is the same exposure as a disabled")
                  print( "       one, with none of the visibility. Check the cron expression.")
                  sys.exit(1)
              print(f"OK: active, registered {a:.1f}d ago, first scheduled run still pending (grace {grace}d).")
              sys.exit(0)

          a = age_days(last)
          if a > max_gap:
              print(f"FATAL: {wf} is active but its last run was {a:.1f} days ago")
              print(f"       (max {max_gap}). A daily cron this stale has been dropping runs, so")
              print( "       the tree has gone unaudited for that window while nothing showed red.")
              sys.exit(1)
          print(f"OK: active, last run {a:.1f}d ago (max {max_gap}d).")
          PY

  required-unfiltered:
    name: required-unfiltered — required contexts cannot be skipped
    runs-on: ubuntu-latest
    # Added 2026-08-10 alongside de-filtering db-tests.yml + worker-ci.yml.
    #
    # WHAT IT ENFORCES. A workflow backing a branch-protection REQUIRED status check
    # must not be skippable. FOUR enumerated evasions, at two levels — (a) and (b)
    # were the original cut; (c) and (d) were found by Sec at F-1 (2026-08-10), which
    # demonstrated that a job-only checker passes BOTH of them:
    #
    #   (a) `paths:` / `paths-ignore:` on the WORKFLOW → the check never reports.
    #       GitHub: "If a workflow is skipped due to path filtering, branch filtering
    #       or a commit message, then checks associated with that workflow will remain
    #       in a 'Pending' state." The PR does not go red — it HANGS, unmergeable,
    #       with nothing anywhere showing a failure. Both doc-only PRs merged on
    #       2026-08-10 (#388, #390) would have deadlocked this way had the three
    #       path-filtered contexts been required at the time. That is why they were
    #       withdrawn from the required list rather than promoted.
    #
    #   (b) A job-level `if:` on the JOB → the check reports SUCCESS without running.
    #       This is the more dangerous one and it is not symmetrical with (a). GitHub
    #       reports a conditionally-skipped job as "Success" to branch protection, and
    #       that green is INDISTINGUISHABLE IN THE CHECKS LIST from a real pass. It is
    #       the standard remedy for (a), and it is rejected here: it makes the filter
    #       an unguarded input to a required gate, so narrowing the filter in some
    #       later refactor turns the gate permanently, silently green. An enforced
    #       gate that cannot fail is strictly worse than an advisory one everybody
    #       knows is advisory — the second is merely unenforced, the first is
    #       unfalsifiable while looking enforced.
    #
    #   (c) A STEP-level `if:` → the job runs and reports success while the real work
    #       inside it is silently skipped. This is (b) expressed one level below where
    #       a job-only checker reads, it is a SMALLER-looking diff than gating the
    #       job, and it is therefore the shape a real refactor actually reaches for.
    #       Cleanup conditionals stay legal: bare always() / success() / failure() /
    #       cancelled() pass, because `if: always()` on a stack-teardown step is
    #       correct and both de-filtered workflows have one. The match is EXACT, not
    #       substring — `always() && contains(..., 'supabase/')` contains an allowed
    #       conditional while being exactly the path-gate this fence rejects. A filter
    #       wearing cleanup clothing.
    #
    #   (d) `continue-on-error` at JOB or STEP level → a different hazard from every
    #       other entry here, and the nastiest to read: the battery RAN, it FAILED,
    #       and the context is green anyway. Nothing about the run looks unusual.
    #
    # This matters most for `pgTAP RLS battery`, which is the C2 merge gate on the
    # ADR-049 migration (Sec joint-review). Until this change that gate was enforced
    # only by a human reading the result.
    #
    # ⚠ WHAT THIS FENCE DOES NOT DO — TWO RESIDUALS, both structural.
    #
    #   1. IT CANNOT GUARD ITSELF. The enumeration above closes the `paths:`-on-
    #      security-scan.yml direction, and this job is listed in the manifest so it
    #      checks itself. But a guard cannot detect its own NON-EXECUTION: add an
    #      `if:` to THIS job and it is skipped, reports SUCCESS to branch protection,
    #      and never runs to notice. Extending the checker does not protect the
    #      checker — no in-band fix exists, because any check that would catch it is
    #      subject to the same evasion. Its only real cover is out-of-band: CI-fence
    #      changes are Sec-joint-review-mandatory, so a human reads the diff.
    #      (Sec, F-1 verdict, 2026-08-10.)
    #
    #   2. THE ENUMERATION IS NOT A PROOF. Four evasions are enforced because four
    #      are known. GitHub can add a fifth, and this fence would keep passing while
    #      the property it advertises quietly stopped holding — the first cut passed
    #      (c) and (d) for exactly that reason and looked healthy doing it. Read this
    #      job's green as "none of the four enumerated evasions is present," never as
    #      "green implies ran." When a new shape is found, extend the list AND add a
    #      self-test case; silence is not coverage.
    #
    # ⚠ KNOWN BLIND SPOT — stated here and not only in the PR that added it, because
    #   a fence whose limitation is documented somewhere else is a fence whose
    #   limitation is undocumented:
    #
    #     This job proves that every context LISTED in .github/required-contexts.tsv
    #     is unskippable. It CANNOT prove the manifest matches actual branch
    #     protection. Reading branch protection needs repo-ADMIN scope; CI's
    #     GITHUB_TOKEN 404s on GET /repos/{o}/{r}/branches/main/protection. So a
    #     context that is required in GitHub but absent from the manifest is
    #     unchecked — that is the live gap, and it is the under-enforcing direction.
    #     (Over-enforcing — a manifest line for something not actually required — is
    #     harmless: it holds an unfiltered workflow unfiltered.)
    #
    #     ⚠ THE GAP IS NOT UNIFORMLY SILENT, and the distinction tells you what to
    #     look for (Sec, F-3 accuracy addition, 2026-08-10). An unmanifested required
    #     workflow fails in one of two very different ways:
    #       - if it is PATH-FILTERED → a VISIBLE DEADLOCK. The PR hangs at "Expected —
    #         waiting for status to be reported". Loud, unmissable, self-announcing.
    #       - if it carries a job-level `if:` → SILENTLY GREEN. Nothing reports.
    #     Only the second shape is the dangerous residual. At every re-verification,
    #     that is the one to hunt for.
    #
    #     Rejected fix: a PAT with admin scope in a CI secret. That would place a
    #     production-reaching credential in the CI secret store, colliding head-on
    #     with the CI/production non-overlap commitment that `secrets-nonoverlap`
    #     (this same workflow) exists to enforce. Trading a documented manifest-sync
    #     gap for a hole in the non-overlap posture is a bad trade.
    #
    #     Accepted compensating control: a HUMAN re-verification at every promotion,
    #     run by the F/CTO. The command is in the header of required-contexts.tsv.
    #     Do not read this job's green as "the manifest is current."
    #
    # WHY THE CHECK IS A YAML PARSE AND NOT A grep — the pattern used by the other
    # fences here. A grep for `paths:` cannot distinguish a live filter from the
    # string appearing in a comment, and the headers of db-tests.yml and worker-ci.yml
    # both discuss `paths:` at length precisely because they explain why they must not
    # have one. A grep fence would go red on its own documentation, get discounted as
    # noisy, and then get deleted. Structure has to be read as structure.
    #
    # The checker self-tests its own discriminator on every run (see the SELF-TEST
    # block in the script). Against a fail-closed instrument a gutted checker produces
    # a false GREEN that is invisible in the checker's own result — every real
    # workflow passes and the job looks healthy. Verified 2026-08-10 by gutting
    # check_workflow() to `return []`: the self-test caught it and failed the job.
    steps:
      - uses: actions/checkout@v4

      # setup-python rather than the runner's system python: a bare `pip install`
      # into system python fails with PEP 668 "externally-managed-environment" on
      # newer Ubuntu images, and the image's preinstalled package set is not a
      # contract this repo controls. Both failure modes are fail-CLOSED (the job
      # goes red; it never goes green without having checked) — but a fence that
      # reds for an install reason nobody can diagnose is how a fence gets
      # discounted and then deleted. Boring and pinned.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML (parse workflows as structure, not as text)
        run: python3 -m pip install --quiet pyyaml

      - name: Assert no required context can be skipped
        run: python3 .github/scripts/required_unfiltered.py
