# .github/workflows/web-tests.yml
#
# Phase 6 (SELF-185) — SvelteKit web-app CI: svelte-check + Vite build + docker build.
# Verifies Frontend's scaffold under api/ and every future frontend PR touching api/**.
#
# Design anchors (mirrors db-tests.yml, opposite of security-scan.yml):
#   - Own workflow (NOT a job in security-scan.yml): the fences there are cheap grep,
#     run-always, no `paths:` filter (fail-closed). This job is a heavier Node install +
#     Vite build + docker build → path-triggered on api/** only. Same rationale as the
#     pgTAP battery: expensive stack work is scoped to the PRs that change its inputs.
#   - NOT a branch-protection required check. Path-filtered jobs can't be required
#     (they'd deadlock PRs that don't touch api/, exactly like db-tests). It gates in
#     practice by running on api/ PRs + team-lead observing green before merge.
#   - Node 22 pinned to match api/Dockerfile's build+runtime base (node:22-bookworm-slim),
#     so CI's toolchain == the deploy runtime. npm cache is keyed on api/package-lock.json.
#   - The `docker build api/` step is the one AC item that can't be verified locally in
#     the same env — it closes "Dockerfile builds the container" on real CI.

name: Web tests (svelte-check + build + docker)

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/web-tests.yml'
  push:
    branches: [main]  # also on main to catch direct-push regressions if branch protection ever lapses
    paths:
      - 'api/**'
      - '.github/workflows/web-tests.yml'

jobs:
  web-app:
    name: Web app — svelte-check + build + docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (22, matches api/Dockerfile runtime)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install deps (npm ci from lockfile)
        working-directory: api
        run: npm ci

      - name: Type-check (svelte-kit sync + svelte-check)
        working-directory: api
        run: npm run check

      - name: Unit tests (vitest — OQ-3 harness; SELF-198 + relay-leg + QA api specs)
        # OQ-3: api/ Vitest runner. Runs Frontend's SELF-198 specs, the Option-C
        # relay-leg tests, and QA's api-tier tests (previously unrunnable — no runner).
        # Node-env, hermetic (no DB / no live creds → no secrets-manifest touch).
        working-directory: api
        run: npm run test

      - name: Build (Vite production build via adapter-node → build/)
        working-directory: api
        run: npm run build

      - name: Docker build (multi-stage adapter-node image — AC "Dockerfile builds")
        # No push — build-only verification that the container assembles cleanly.
        run: docker build api/

  dependency-audit:
    name: api — dependency vuln audit (npm audit)
    runs-on: ubuntu-latest
    # SELF-206 (Sec condition on the jose@^6.2.5 dep for RT-05 ES256/JWK verify):
    # api/ had no dependency-vuln audit; Sec requires one. Boring choice — npm's
    # native `npm audit` against the committed lockfile, no third-party scanner.
    #
    # THRESHOLD RATIONALE (fail-closed on real risk, not on pre-existing noise):
    #   --audit-level=moderate ⇒ the job FAILS on any moderate/high/critical
    #   advisory (e.g. a future compromised `jose`) and PASSES on LOW-severity
    #   ones. The triaged low-sev baseline is the `cookie <0.7.0` advisory
    #   (GHSA-pxg6-pf52-xh8x), which npm surfaces on `cookie` itself and on each
    #   dependent that pins it (@sveltejs/kit → @sveltejs/adapter-node); its only
    #   remediation today is a BREAKING SvelteKit downgrade (`npm audit fix
    #   --force`) — deliberately not taken. jose itself added 0 new advisories.
    #   If it ever gains a non-breaking fix, apply it and tighten to `low`.
    #   Runs off the lockfile (no npm ci) — npm audit builds the tree from
    #   package-lock.json and queries the registry advisory DB.
    #
    #   This block deliberately carries NO advisory tally. The count is a live
    #   property of the registry advisory DB, not of the lockfile: advisories get
    #   published and patched upstream without any commit here. A number written
    #   down goes stale silently and then the comment misdescribes the fence's own
    #   baseline. Measure it (`cd api && npm audit --json | jq .metadata`), never
    #   recall it. A previous revision of this block asserted a fixed low-sev
    #   count and had drifted by the time anyone read it.
    #
    # READING `npm audit` OUTPUT — the `range` field is a UNION, not an advisory:
    #   npm collapses every advisory reaching a package into one node and prints
    #   the widest vulnerable range across all of them plus the highest severity.
    #   So a package can be reported at a range that INCLUDES its own patched
    #   version, because a second, lower-severity advisory reaches it too. Worked
    #   example (measured 2026-08-08, api/ @ bd7ec36): npm printed
    #   `@sveltejs/kit <=2.70.2 / Severity: moderate`, but the moderate advisory
    #   (GHSA-29g2-3rmr-qm68, SvelteKit ReDoS) is `<= 2.70.1`, first patched
    #   `2.70.2` per the GitHub Advisory API. The `<=2.70.2` came from unioning it
    #   with the low `cookie` advisory. Verify a range against
    #   `gh api /advisories/<GHSA-ID>`, not against npm's rendering — otherwise a
    #   real fix looks like a fence going green over an unfixed condition, and a
    #   real non-fix can look like a fix.
    #
    # SCOPE CAVEAT — this job is PATH-FILTERED on `api/**` (see the workflow-level
    #   `on:` block). It reports the state of the last commit that touched that
    #   path, NOT the state of the tree. A newly published advisory against an
    #   api/ dependency leaves `main` reading green until some PR happens to touch
    #   api/ — at which point that PR inherits a failure it did not cause. This
    #   happened on 2026-08-08: a moderate sat unreported on main until an
    #   unrelated lockfile PR triggered the lane. The unfiltered fail-closed
    #   counterpart is `scanner-npm-audit` in security-scan.yml (high+critical,
    #   no `paths:` filter), so nothing above `high` can hide this way — but
    #   moderate-only findings can, and "main is green" does not mean "the tree
    #   is clean at moderate".
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (22, matches api/Dockerfile runtime)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: npm audit (fail-closed at moderate+; pre-existing low-sev triaged)
        working-directory: api
        run: npm audit --audit-level=moderate
