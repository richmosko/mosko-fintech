# .github/workflows/etl-ci.yml
#
# workers/etl (pfin_back_etl) unit-test CI lane — closes the ETL-CI-rehoming gap
# (SELF-230; F/CTO-ratified Path B, 2026-08-02). Prior to this, NO workflow ran
# pytest over workers/etl/tests/: security-scan.yml's TBC fence greps
# workers/etl/src/ but runs no tests, and worker-ci.yml is scoped to
# workers/provider-sync/** only. That left the ETL unit suite CI-invisible — a
# green PR gave VACUOUS assurance for the ETL half of any change under workers/etl/.
#
# Design anchors:
#   - security-scan.yml = cheap grep fences, run-always, NO paths filter (fail-closed).
#   - db-tests.yml / worker-ci.yml = heavier stack spin-ups, ALSO run-always as of
#     2026-08-10 (PR #393 / #406) — they were de-filtered precisely so they could
#     become required contexts.
#   This file follows worker-ci.yml, which now means RUN-ALWAYS, no `paths:` filter.
#   It stays a separate FILE (not a job in worker-ci.yml) so an ETL change doesn't
#   cross-trigger the provider-sync jobs and vice versa — one worker, one workflow,
#   house style. Separate file and run-always are independent choices; only the
#   second one changed.
#
# RUN-ALWAYS (no `paths:` filter). Both jobs here were PATH-TRIGGERED on the
# workers/etl tree until this change, on the rationale that "a doc-only PR shouldn't
# run the ETL suite." That rationale is retired, for two reasons — and the second one
# is not a preference, it is a constraint:
#
#   (i)  COST. Measured over the last eight runs of this workflow, it completes in
#        29–48s. The repo is PUBLIC (`gh repo view --json visibility`), so
#        standard-runner Actions minutes are free and unmetered. A doc-only PR now
#        runs the ETL suite for well under a minute at $0. Re-measure before citing
#        this; do not recall it.
#
#   (ii) CORRECTNESS — the half that forces the choice. A path-filtered workflow
#        CANNOT be a branch-protection required check. GitHub: "If a workflow is
#        skipped due to path filtering, branch filtering or a commit message, then
#        checks associated with that workflow will remain in a 'Pending' state." So a
#        required-but-filtered context does not go red — it HANGS, and deadlocks every
#        PR that touches no matching path. GitHub's guidance: "You should not use path
#        or branch filtering to skip workflow runs if the workflow is required to pass
#        before merging."
#        <https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks>
#
# BOTH JOBS BELOW BACK REQUIRED CONTEXTS (.github/required-contexts.tsv). That is what
# makes the filter deletion load-bearing rather than cosmetic: re-adding a `paths:`
# key here would not merely widen coverage back down, it would convert two live merge
# gates into permanent deadlocks.
#
# WHY NOT the standard remedy (a job-level `if:` off a changed-files detector, which
# GitHub reports as "Success" when skipped): that green is emitted by GitHub's skip
# semantics and is indistinguishable in the checks list from a real pass, which makes
# the path filter an unguarded input to a required gate. Full argument in
# db-tests.yml's header; not restated here.
#
# The `required-unfiltered` fence in security-scan.yml fails closed if a `paths:` key
# reappears in this file.
#
# TWO LANES, BOTH SECRETS-FREE by design:
#
#   `unit` — runs `pytest -m unit` (the README-documented, no-credentials-needed
#     selector). The @integration lane needs a live BLS key + a real DB and is
#     keyed/manual — it MUST NOT hard-fail CI for lack of a BLS key, so it stays
#     DESELECTED under --strict-markers. No .env is checked out (.env is gitignored;
#     only .env.example is tracked); the unit tests mock os.environ, so they are
#     hermetic — verified green with creds unset.
#
#   `pgtest` — runs `pytest -m pgtest` against a `postgres:17` SERVICE CONTAINER.
#     ⚠ THE DISTINCTION THAT MAKES THIS LANE POSSIBLE IS "REAL POSTGRES" vs "REAL
#     STACK", AND THEY ARE NOT THE SAME REQUIREMENT. These tests create ONLY
#     `create temp table` — no V1 schema, no migrations, no project roles, no
#     credentials, no API keys. So a bare Postgres satisfies them, and a bare
#     Postgres needs nothing from either secret store. Conflating the two is what
#     had this suite filed as @integration and permanently ungateable.
#
#   NEITHER LANE TOUCHES A SECRET → this workflow does NOT interact with the
#   secrets-manifest non-overlap fence, and must not start. The `postgres:postgres`
#   credential below is NOT a secret in the manifest's sense: it is a literal for an
#   ephemeral container that exists only for the life of one job and is reachable
#   only from that job's network namespace. Same posture, and the same reasoning, as
#   db-tests.yml's hardcoded local DSN. If wiring anything here ever appears to need
#   a real secret, that means the tier boundary has been breached — STOP and route to
#   DevOps + Sec rather than adding one.
#
# PACKAGE-IMPORT NOTE: pyproject.toml declares no [build-system], so `uv sync` alone
# does NOT install the pfin_back_etl package into site-packages (src-layout → import
# fails at collection). We mirror the Dockerfile's `uv pip install -e .` to make the
# package importable, then run pytest with --no-sync so the run doesn't drop the
# editable install.

name: ETL CI (workers/etl)

# NO `paths:` FILTER — deliberate, and load-bearing. See "RUN-ALWAYS" above before
# adding one back: both jobs here back branch-protection required contexts, and a
# `paths:` key would silently convert those gates into permanent deadlocks. The
# `required-unfiltered` fence in security-scan.yml fails closed if one reappears.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]  # also on main to catch direct-push regressions if branch protection ever lapses

defaults:
  run:
    working-directory: workers/etl

jobs:
  unit:
    name: Unit tests + lint (pytest -m unit; hermetic, no secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (provisions Python per workers/etl/.python-version = 3.14)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: 'workers/etl/uv.lock'

      - name: Sync deps (frozen lockfile; dev=ruff + test=pytest groups)
        run: uv sync --frozen --group dev --group test

      - name: Install project editable (src-layout; no [build-system] → mirrors Dockerfile)
        run: uv pip install -e .

      - name: Lint — ruff check (src/; the SELF-230 core.py surface)
        # Scoped to src/ deliberately. tests/ carries ONE pre-existing E402
        # (conftest.py:176 — a deliberate late `import replay` after sys.path setup)
        # that predates SELF-230. Full-tree ruff-in-CI is deferred to the ETL-ruff
        # follow-up (fix = a `# noqa: E402` in the QA-owned conftest, out of this PR's
        # scope). Scoping to src/ lints the changed importer without red-on-incumbent-debt.
        run: uv run --no-sync ruff check src

      - name: Unit tests (pytest -m unit; non-unit markers deselected)
        # ⚠ NO TEST COUNT IN THIS STEP NAME OR THESE COMMENTS, DELIBERATELY. Both
        # numerals that used to live here ("55 run", "17 non-unit") were stale, and
        # nothing in CI could ever have noticed: a count written into a step name has
        # no watcher on the event that falsifies it — every new test invalidates it
        # silently while the step keeps passing. Adding a test is supposed to be a
        # non-event here. Do not "helpfully" restore a number; if a specific count
        # ever needs to be enforced, enforce it with an assertion that fails, not with
        # a string a reader has to trust.
        #
        # --strict-markers (pyproject addopts): unknown markers error. `-m unit` selects
        # ONLY unit-marked tests → the non-unit tests (incl. BLS-keyed @integration)
        # are DESELECTED, never hard-failing CI for a missing key. Hermetic: unit tests
        # mock os.environ, so no .env / no credentials are required.
        #
        # FAIL-CLOSED, same as the pgtest lane: if the `unit` marker is ever
        # unregistered or every unit test deleted, pytest collects 0 and exits 5 →
        # job red. Do not add `|| true` or `continue-on-error`.
        run: uv run --no-sync pytest -m unit

  pgtest:
    name: Staging-update regression (pgtest; real Postgres, zero secrets)
    runs-on: ubuntu-latest

    # ⚠ WHY THIS JOB EXISTS. `_staging_update` seeded its staging table with a full
    # copy of the target PLUS the update rows, so every updated key matched TWO
    # staging rows and Postgres consistently took the STALE one — `update_table_df`
    # never reliably updated anything (BACKLOG §7.6 S17). Until this lane ran, A
    # REVERT OF THAT FIX PASSED CI. The defect is a Postgres join semantic, so only a
    # real Postgres can observe it; a SQLite stand-in would report coverage of the one
    # thing it structurally cannot see.
    services:
      postgres:
        # ⚠ MAJOR PINNED TO MATCH THE LOCAL STACK (17; measured 17.6 local / 17.10 on
        # the verification container). The major is the semantic boundary that matters
        # here — these tests assert on `UPDATE … FROM` multi-match behaviour, and a
        # CI/local major split is how a semantic test quietly starts asserting against
        # a different database than the one developers run. The patch is deliberately
        # left floating: pinning it would drift from the local stack in the other
        # direction as local takes patch bumps.
        image: postgres:17
        env:
          # ⚠ NOT A SECRET, and must never become one. Ephemeral container, one job's
          # lifetime, reachable only from this job. Literal by design — see the
          # secrets-free note in the file header.
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgtest
        ports:
          - 5432:5432
        # Health-gated so the first connection cannot race the container's init. The
        # -d flag matters: the server restarts once during init, and `pg_isready`
        # without a target database reports ready during that window.
        options: >-
          --health-cmd "pg_isready -U postgres -d pgtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # psycopg2 (workers/etl pins psycopg2-binary), so the bare `postgresql://`
      # scheme — NOT `postgresql+psycopg://`, which selects the uninstalled psycopg3.
      PFIN_PGTEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/pgtest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv (provisions Python per workers/etl/.python-version = 3.14)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: 'workers/etl/uv.lock'

      - name: Sync deps (frozen lockfile; test group)
        run: uv sync --frozen --group test

      - name: Install project editable (src-layout; see PACKAGE-IMPORT NOTE)
        # The suite imports `staging_seed_sql` from the module under test rather than
        # re-typing the SQL, so the package must be importable or the tests would
        # pin their own copy — a detector blind to the code it guards.
        run: uv pip install -e .

      - name: Staging-update regression (pytest -m pgtest)
        # ⚠ THIS STEP IS FAIL-CLOSED BY DEFAULT AND MUST STAY THAT WAY. Two ways the
        # lane could go vacuous, and neither is green:
        #   · tests deleted / marker unregistered → 0 collected → pytest EXIT CODE 5
        #     → job red. (Measured: exit 5 on an unmatched -m selector, 0 when the
        #     tier is populated.) Do NOT add `|| true`, `--exitfirst` tolerance, or a
        #     `continue-on-error` — each would have to ACTIVELY DEFEAT this default.
        #   · PFIN_PGTEST_URL unset → the fixture RAISES rather than skipping, because
        #     GitHub sets CI=true. That guard is Backend's and it is deliberate: a
        #     skip is indistinguishable from a pass in a summary line. Do NOT "fix"
        #     it into a skip.
        run: uv run --no-sync pytest -m pgtest
