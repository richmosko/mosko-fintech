# .github/workflows/worker-ci.yml
#
# provider-sync worker CI — slice 3b (DevOps, folds task #13 live-DB lane).
#
# Design anchors:
#   - security-scan.yml = cheap grep fences, run-always, NO paths filter (fail-closed).
#   - db-tests.yml      = heavy Postgres spin-up, ALSO run-always as of 2026-08-10.
#   This file follows db-tests.yml, which now means RUN-ALWAYS, no `paths:` filter.
#
# RUN-ALWAYS (no `paths:` filter). Both jobs here were PATH-TRIGGERED until
# 2026-08-10, on the rationale that "a doc-only PR shouldn't spin a DB." Measurement
# and a correctness constraint together retired that rationale:
#
#   (i)  COST. Measured over the last six runs, this workflow completes in 1–2 min,
#        concurrent with the sub-minute security-scan fences. The repo is PUBLIC
#        (`gh repo view --json visibility`), so standard-runner Actions minutes are
#        free and unmetered. A doc-only PR now spins a DB for ~2 min at $0 — which
#        is a real cost, just a much smaller one than the original estimate implied.
#        Re-measure before citing this; do not recall it.
#
#   (ii) CORRECTNESS — the half that forces the choice. A path-filtered workflow
#        CANNOT be a branch-protection required check. GitHub: "If a workflow is
#        skipped due to path filtering, branch filtering or a commit message, then
#        checks associated with that workflow will remain in a 'Pending' state." So
#        a required-but-filtered context deadlocks every PR touching no matching
#        path. GitHub's guidance: "You should not use path or branch filtering to
#        skip workflow runs if the workflow is required to pass before merging."
#        <https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks>
#
# WHY NOT the standard remedy (job-level `if:` off a changed-files detector, which
# GitHub reports as "Success" when skipped): that green is emitted by GitHub's skip
# semantics and is indistinguishable in the checks list from a real pass, making the
# filter an unguarded input to a required check. Same reasoning Sec applied at F-2
# relocating RT-27 below. Full argument in db-tests.yml's header; not restated here.
#
# The `required-unfiltered` fence in security-scan.yml fails closed if a `paths:`
# key reappears in this file.
#
# Two jobs:
#   - `unit`        : hermetic vitest + typecheck + build. Closes the gap that TODAY
#                     only the fences (fence-tbc-node) touch worker code — a logic
#                     regression in the adapters / mapper / resolution would otherwise
#                     sail through. The integration specs self-SKIP LOUDLY here
#                     (RUN_DB_INTEGRATION unset) — no false green.
#   - `integration` : provisions the local Supabase stack (migrations 001–021, incl.
#                     007 vault + 016/020 partial-unique indexes the SC-4 test needs),
#                     sets RUN_DB_INTEGRATION=1, runs the live-DB lane (G2/G3/SC-4).
#                     db-only via `-x` (the harness connects as postgres + SET LOCAL
#                     ROLE service_role; no GoTrue/JWT path — same rationale as
#                     db-tests.yml). Credentials-free: local DSN is not a secret, so
#                     this lane does NOT touch the secrets-manifest non-overlap fence.
#
# TRANSPORT NOTE: this worker stays OFF the RT-26 allowlist (direct-Postgres
# PFIN_DB_*, no @supabase/supabase-js, no SUPABASE_SERVICE_ROLE_KEY). fence-tbc-node
# (security-scan.yml) mechanically enforces that; this file adds NO service-role key.

name: Worker CI (provider-sync)

# NO `paths:` FILTER — deliberate, and load-bearing. See "RUN-ALWAYS" above before
# adding one back: both jobs here back branch-protection required contexts, and a
# `paths:` key would silently convert those gates into permanent deadlocks. The
# `required-unfiltered` fence in security-scan.yml fails closed if one reappears.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]  # also on main to catch direct-push regressions if branch protection ever lapses

defaults:
  run:
    working-directory: workers/provider-sync

jobs:
  unit:
    name: Unit + typecheck + build (hermetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'  # matches workers/provider-sync/Dockerfile FROM node:22-bookworm-slim

      - name: Install deps (clean, lockfile-pinned)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests (integration specs self-skip loudly — no RUN_DB_INTEGRATION)
        run: npm run test

  # NOTE: the RT-27 admission private-bind config-lint (fence-admission-bind) lives
  # in .github/workflows/security-scan.yml (RUN-ALWAYS, no paths filter), NOT here.
  # Relocated per Sec F-2 (code-half review, RT-27 fence owner): a §10-catalogued
  # instance must be run-always like RT-22/RT-26 — a path-trigger leaves a trigger-
  # drift meta-risk (a future `paths:` refactor silently disabling the fence) that is
  # not acceptable for this surface. See security-scan.yml `fence-admission-bind`.

  integration:
    name: Live-DB integration lane (G2/G3/SC-4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Supabase CLI (pinned, shared source of truth)
        uses: ./.github/actions/supabase-cli-setup

      - name: Start local stack (db-only; -x drops non-db services incl gotrue/auth)
        # `supabase start` applies supabase/migrations/** (001–021) on bring-up —
        # incl. 007 (vault: SimpleFINAdapterAdmission G3 needs vault.create_secret) and
        # 016/020 (symbol/cusip partial-unique indexes: resolution SC-4 dedup). `-x`
        # excludes the non-db service containers (the harness never uses GoTrue/JWT —
        # it connects as postgres + SET LOCAL ROLE service_role). Invalid `-x` names
        # only warn, so this list is safe across CLI versions.
        working-directory: .
        run: |
          supabase start -x gotrue,realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps (clean, lockfile-pinned)
        run: npm ci

      - name: Run live-DB integration lane
        # `npm run test:integration` = `RUN_DB_INTEGRATION=1 vitest run tests/integration`
        # (workers/provider-sync/package.json) — the single source of truth for the lane,
        # so CI and local-dev run the IDENTICAL command. RUN_DB_INTEGRATION=1 flips
        # tests/integration/_liveDb.ts from loud-skip to live; PFIN_DB_* stays at the
        # _liveDb.ts local defaults (127.0.0.1:54322, postgres/postgres) — the supabase
        # local stack DSN, NOT a secret.
        run: npm run test:integration

      - name: Stop local stack
        if: always()
        working-directory: .
        run: supabase stop --no-backup || true

  pdf-render:
    name: pdf-render worker battery (real headless Chromium)
    runs-on: ubuntu-latest
    # Sec F-14 (SELF-348 A4 PR #634 review): zero CI job ran this worker's test
    # battery — `worker-ci.yml`'s top-level `defaults.run.working-directory`
    # pins `workers/provider-sync`, so this file's existing jobs never touch
    # `workers/pdf-render/`, and `scheduled-dep-audit.yml`'s auto-discovery
    # covers `npm audit` only, not the battery. This job overrides the
    # working-directory at the job level (below) to add pdf-render coverage
    # to the SAME file rather than a new one, per team-lead dispatch.
    #
    # RUN-ALWAYS, no `paths:` filter — DEVIATION FROM team-lead's dispatch,
    # which authorized `workers/pdf-render/**` path-triggering as acceptable
    # for this job specifically (a test job, not a fence, so the
    # required-unfiltered discipline this file's header argues for doesn't
    # bind it the same way). Chose run-always instead because: (1) it matches
    # this file's own stated design philosophy verbatim — the header above
    # argues AGAINST path-filtering on cost grounds (public repo, free
    # unmetered Actions minutes) and on correctness grounds (a path-filtered
    # workflow can never safely become a required check later); (2) the
    # runner's own Chromium is used (Sec-verified: GitHub's ubuntu-latest
    # image ships Chromium as a pre-installed browser), so this job does NOT
    # pay a Docker-build or apt-install cost — it is closer in weight to
    # `unit` above than to `integration`. If a future path-filtered shape is
    # preferred, it needs its own trigger mechanism, since a job-level `if:`
    # here would only skip STEPS, not the runner minute this job already
    # spends spinning up — flagged to team-lead as a judgment call to revisit
    # if this job's cost profile changes (e.g. if it ever needs a real apt
    # install because the runner's bundled Chromium version drifts too far
    # from the Dockerfile's pinned one for parity to hold).
    defaults:
      run:
        working-directory: workers/pdf-render
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'  # matches workers/pdf-render/Dockerfile FROM node:22-bookworm-slim

      - name: Install deps (clean, lockfile-pinned)
        run: npm ci

      - name: Locate a Chromium/Chrome binary
        # Discovery, not a hardcoded path — the exact binary name varies by
        # runner-image version (chromium vs chromium-browser vs
        # google-chrome-stable). GitHub's ubuntu-latest ships Chromium
        # pre-installed (verified against actions/runner-images' published
        # software manifest, 2026-09-05) so this should always find one
        # without an apt-get; the install fallback exists so this job does
        # not silently start skipping if a future runner image drops it.
        run: |
          set -e
          CANDIDATE=""
          for bin in google-chrome-stable google-chrome chromium-browser chromium; do
            if command -v "$bin" >/dev/null 2>&1; then
              CANDIDATE="$(command -v "$bin")"
              break
            fi
          done
          if [ -z "$CANDIDATE" ]; then
            echo "No pre-installed Chrome/Chromium found on the runner — installing chromium via apt as a fallback."
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends chromium || sudo apt-get install -y --no-install-recommends chromium-browser
            for bin in chromium chromium-browser; do
              if command -v "$bin" >/dev/null 2>&1; then
                CANDIDATE="$(command -v "$bin")"
                break
              fi
            done
          fi
          if [ -z "$CANDIDATE" ]; then
            echo "FATAL: could not locate or install a Chrome/Chromium binary on the runner." >&2
            exit 1
          fi
          echo "PUPPETEER_EXECUTABLE_PATH=$CANDIDATE" >> "$GITHUB_ENV"
          echo "Resolved Chrome/Chromium binary: $CANDIDATE"

      - name: Require PUPPETEER_EXECUTABLE_PATH (Sec F-14 — must FAIL if unset, not skip)
        # render.test.js self-skips into a PASSING "SKIPPED" test when
        # PUPPETEER_EXECUTABLE_PATH is unset (worker source, verified —
        # test/render.test.js's own early-return branch), which would let
        # this job go green having run 1 test instead of the real 14. This
        # step makes that impossible by construction: it hard-fails BEFORE
        # `npm test` ever runs if the previous step failed to resolve a real,
        # executable binary — the self-skip branch inside the test file can
        # then never be reached with an unset/invalid path from this job.
        run: |
          if [ -z "${PUPPETEER_EXECUTABLE_PATH:-}" ] || [ ! -x "$PUPPETEER_EXECUTABLE_PATH" ]; then
            echo "FATAL: PUPPETEER_EXECUTABLE_PATH is unset or not an executable file (got: '${PUPPETEER_EXECUTABLE_PATH:-<unset>}'). Failing closed rather than letting render.test.js's self-skip produce a false green." >&2
            exit 1
          fi
          echo "OK: PUPPETEER_EXECUTABLE_PATH=$PUPPETEER_EXECUTABLE_PATH is executable."

      - name: Run the worker battery (auth.test.js + render.test.js, real Chromium)
        # NOT `npm test` — its script (`node --test test/`, a bare directory
        # argument) crashes with MODULE_NOT_FOUND before running a single
        # test, verified independently of this job under a real
        # node:22-bookworm-slim container (matching the Dockerfile exactly)
        # AND under a local Node 26: `node --test test/` and `node --test
        # ./test/` both fail identically; bare `node --test` (Node's own
        # default recursive discovery, zero path args) and `node --test
        # test/*.test.js` (shell-expanded glob) both correctly run all 20
        # tests. This is a genuine, pre-existing defect in
        # workers/pdf-render/package.json's own "test" script, independent
        # of Sec F-14's self-skip finding — routing around it here so this
        # job actually runs the battery rather than papering over it; flagged
        # to Backend to fix the script itself (worker source, not this file's
        # surface to edit).
        run: node --test
