# secrets-manifest.yml — CI / production secret NON-OVERLAP commitment.
# Phase 5 Step 8 (DevOps-owned; Sec-consult mandatory at lock per WORKFLOW.md).
#
# ┌─ INVARIANT (machine-enforced; fail-closed) ────────────────────────────────┐
# │ No secret NAME may appear in BOTH `ci_only` and `production_only`.          │
# │ A leaked CI secret must NEVER grant production access, and a leaked         │
# │ production secret must NEVER reach CI — the two sets are disjoint by         │
# │ construction (blast-radius containment).                                    │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# Enforced by scripts/ci/check-secrets-nonoverlap.py, run as the
# `secrets-nonoverlap` job in .github/workflows/security-scan.yml on every PR +
# push to main. The check fails closed if: the manifest is missing/malformed,
# either set is absent/not-a-list, a name is duplicated within a set, or the
# intersection of the two sets is non-empty.
#
# DISCIPLINE — distinct-naming rule: any CI/test analogue of a production secret
# MUST take a DISTINCT name (e.g. PLAID_SANDBOX_SECRET, *_TEST). That distinct
# naming is the mechanism that keeps the two sets disjoint. Never reuse a
# production secret name for a sandbox/golden-fixture value.
#
# DISCIPLINE — reservation ≠ provisioning: a `ci_only` entry is a NAME RESERVATION,
# not a provisioning trigger. The value lands in the GitHub Actions secret store
# when a CONSUMER EXISTS; a credential sitting in a store nothing reads can leak
# but cannot help. Because of that, an entry that only reserves a name MUST also
# record whether a distinct non-production value EXISTS and who holds it.
# Otherwise "reserved" reads as "there is nothing to use", and whoever later wires
# the CI job finds no test secret in the store and reaches for the PRODUCTION one —
# which is the exact failure the reservation was made to prevent, reopening at
# provisioning time. Recording existence makes the reservation ACTIONABLE (there is
# something to ASK FOR) rather than aspirational (something to SUBSTITUTE for).
#
# SCOPE NOTE (flagged for Sec joint-review): as of Phase 5 the live GitHub Actions
# runs are credentials-free — db-tests.yml uses a local Supabase stack with a
# hardcoded local DSN (not a secret), the RT-15 replay-parity fixtures use no live
# API/creds, and gitleaks uses only the GitHub-native GITHUB_TOKEN. The `ci_only`
# entries below are therefore RESERVED distinct names (the contract that future CI
# integration tests must follow), not all yet provisioned as live GitHub secrets.
# GITHUB_TOKEN is intentionally EXCLUDED — it is GitHub-native, not a project
# secret (per the existing security-scan.yml gitleaks-job rationale).
#
# ┌─ THIRD TIER — LOCAL DEVELOPMENT: NAMED HERE, AND EXPLICITLY NOT COVERED ────┐
# │ Beyond the CI store and the production store there is a THIRD tier: the      │
# │ credentials on a developer's own machine — `.env` files, shell history,      │
# │ editor state, keychains.                                                     │
# │                                                                              │
# │ THE NON-OVERLAP INVARIANT DOES NOT REACH THIS TIER, AND CANNOT. The          │
# │ invariant at the top of this file is stated over what enters the CI store    │
# │ and what enters the production store. A developer's `.env` is NEITHER of     │
# │ those stores, so no invariant stated over the two can bind it, and the       │
# │ `secrets-nonoverlap` job cannot observe it. There is no fence here.          │
# │                                                                              │
# │ ⚠ Read that as SCOPE, NOT as unimportance. Local dev is the tier where       │
# │ credentials ACTUALLY SIT ON A MACHINE — exposed to backups, screen shares,   │
# │ laptop loss and accidental commits. On exposure it is the HIGHEST tier, not  │
# │ the lowest. This paragraph exists because both shorter framings mislead:     │
# │ omitting local dev implies it does not matter, and naming it without stating │
# │ the non-reach implies this manifest covers it. Neither is true.              │
# │                                                                              │
# │ The substituted discipline — convention and review, NOT machine-enforced:    │
# │  1. `.env` files are gitignored and never committed. gitleaks is a BACKSTOP  │
# │     against the commit, not a control over the credential on disk.           │
# │  2. Local runs use the non-production value under its DISTINCT *_TEST /      │
# │     *_SANDBOX_* name. Borrowing a production credential for a local run is   │
# │     a VIOLATION even though nothing here can detect it. It happened on       │
# │     2026-08-09 with BLS_API_KEY — no test analogue existed, so the only key  │
# │     at hand was production's. That is why BLS_API_KEY_TEST is now reserved.  │
# │  3. Production secret NAMES should be ABSENT from developer machines, so     │
# │     that the name a value is stored under still carries its tier. Where a    │
# │     loader accepts only the production name, that convention SNAPS at the    │
# │     loader boundary and the fix belongs in the loader, not in convention:    │
# │     a `BLS_API_KEY_TEST` override for the ETL param loader would let a       │
# │     developer's `.env` hold the test key under the TEST name with the        │
# │     production name absent entirely — auditable BY SHAPE rather than by      │
# │     trust. Backend-owned. Still not a fence; CI cannot verify a machine.     │
# │     ⚠ That override is an EXTENSION BEYOND the stated AC of BACKLOG.md       │
# │     §7.6 S12 — it is NOT part of it and must NOT be cited as S12. S12        │
# │     rules WHERE the raise happens (moving utils.py's eager ValueError out    │
# │     of the shared param loader into a per-task check, per ADR-048 rider      │
# │     1). This override rules WHICH NAME the key carries. Two different        │
# │     decisions that land in the same function: the override is expected to    │
# │     ride S12's loader split as its implementing VEHICLE and to DEPEND on     │
# │     it — not to be authorised by it. It warrants its own §7.6 entry;         │
# │     inheriting S12's citation would imply an AC covers it that does not.     │
# └──────────────────────────────────────────────────────────────────────────────┘
#
# Anchors: ARCH §5 (per-container secret surface) · ADR-002 §6.0 (secrets
# discipline) · SECURITY RT-26 (SERVICE_ROLE_KEY) · SD-20 (PDF signing key) ·
# ADR-011 Lock 13 mod #2 (PDF worker zero-DB).

version: 1

# CI-only — exist ONLY in GitHub Actions; test / sandbox / golden-fixture values
# with NO production reach. Distinct-named analogues of production secrets.
ci_only:
  - PLAID_SANDBOX_CLIENT_ID      # Plaid sandbox tier for QA integration fixtures (≠ prod PLAID_CLIENT_ID)
  - PLAID_SANDBOX_SECRET         # Plaid sandbox secret (≠ prod PLAID_SECRET)
  - PDF_WORKER_SIGNING_KEY_TEST  # golden test key for PDF-JWT fixtures (≠ prod PDF_WORKER_SIGNING_KEY)
  - SIMPLEFIN_TOKEN_TEST         # SimpleFIN demo/test bridge token for QA fixtures (≠ prod SIMPLEFIN_TOKEN)
  - BLS_API_KEY_TEST             # Non-production BLS registration key for CI and local CPI-U runs (≠ prod BLS_API_KEY). Per ADR-048 rider 2.
                                 #   ⚠ NOT justified on confidentiality, and a reader who objects on that ground is RIGHT: the BLS key
                                 #   is a RATE-LIMIT LIFT, not an access credential — a keyless v1 endpoint serves the same public CPI
                                 #   data (v1: 25 queries/day; v2 keyed: 500). Writing "protect the BLS secret" here would be a claim a
                                 #   future reader can correctly refute, and refuting it would reopen the borrow. The two real reasons:
                                 #   (i) AVAILABILITY COUPLING — production's v2 daily quota is a SHARED, EXHAUSTIBLE resource; a CI or
                                 #   local run spending it degrades the nightly CPI ingest that depends on it, and a backfill re-run is
                                 #   itself quota-priced (ADR-048: the documented recovery action is the one the quota forbids).
                                 #   (ii) KEEPING NON-OVERLAP TRUE IN PRACTICE RATHER THAN BY LUCK — with no test-named analogue, the
                                 #   only BLS key at hand is the production one, so non-overlap holds only until someone needs to run
                                 #   the ingest. On 2026-08-09 a local verification run borrowed the production credential for exactly
                                 #   that reason. The disjointness this file asserts is only worth what the alternative is.
                                 #   EXISTENCE (the fact, never the value): a DISTINCT non-production BLS key EXISTS and is HELD BY
                                 #   F/CTO — registered 2026-08-09 (free, self-service), its value verified distinct from production
                                 #   out of band and recorded as an assertion of that date; the two values were never placed anywhere
                                 #   comparable, and neither appears in this repo. Recorded per the reservation ≠ provisioning rule
                                 #   above so the eventual CI wiring has something to ASK F/CTO FOR, not something to substitute.
                                 #   NOT PROVISIONED as a live GitHub Actions secret: no CI job consumes BLS today, and a credential in
                                 #   a store where nothing reads it can leak but cannot help. Provision at first consumer.
  - CI_MIGRATE_SSH_PRIVATE_KEY   # ADR-072 (Option E) Decision 2 / Sec C6 — box-access class, NOT a data-plane secret. The private
                                 #   half of the forced-command keypair a hosted GitHub-Actions runner uses to SSH to the production
                                 #   VPS as the dedicated non-root `ci-migrate` user (C1: no sudo; sole authorized_keys line is a
                                 #   `restrict,command="/abs/path/orchestrate.sh"` forced command — C2/C3/C5). Held ONLY in the GitHub
                                 #   Actions secret store; disjoint-by-construction from every production_only credential below — this
                                 #   key authenticates a BOX LOGIN, it is never a database or application credential, and possessing it
                                 #   grants exactly what the forced command allows (running the migration Scheduled Task + the app
                                 #   deploy trigger), nothing else, by the `restrict` keyword's fail-closed posture against future
                                 #   `authorized_keys` option additions. CHUNK 1 declared the NAME only. ⚠ CHUNK 2 (ADR-072
                                 #   Consequences) builds the consumer: the `ci-migrate` user, its `authorized_keys` forced-command
                                 #   line, scripts/migrator-orchestrate.sh (all three materialized by scripts/provision-vps.sh), and
                                 #   .github/workflows/migrator-trigger.yml, which reads this name as `secrets.CI_MIGRATE_SSH_PRIVATE_KEY`
                                 #   on every push to `main` touching supabase/migrations/**. STILL NOT YET PROVISIONED as a live
                                 #   GitHub Actions secret as of this PR — the keypair generation, this repo-secret write, and the
                                 #   provisioning run that installs the public half are F/CTO `!`-steps done AFTER merge (see
                                 #   docs/deployment-runbook.md §6.4), never by a script. Until that step runs, the workflow exists but
                                 #   fails closed on its own missing-secret check rather than silently no-op'ing.

# Production-only — real credentials Coolify-injected on the V1 production VPS at
# deploy time (greenfield per ADR-021; the cax21/pfindash.com incumbent is
# reference-only, NOT the deploy target); NEVER present in GitHub Actions.
# Enumerated from the ARCH §5 per-container secret surface.
production_only:
  # (No SUPABASE_ANON_KEY: it is NOT a secret. It is a role:anon JWT, publishable by
  #  construction — RLS + the ADR-029 aal2 backstop are the controls, not confidentiality.
  #  It reaches the app as PUBLIC_SUPABASE_ANON_KEY (SvelteKit $env/dynamic/public;
  #  api/.env.example) and is injected as non-secret runtime config per deployment-runbook
  #  §5. Listing it here would assert a blast radius that does not exist and would put a
  #  production-tier NAME on developer machines that must hold the local stack's value.)
  - SUPABASE_SERVICE_ROLE_KEY    # V1 web-app (RT-26 ARCH §4.1 allowlist only)
  - PDF_WORKER_SIGNING_KEY       # V1 web-app + PDF worker (SD-20)
  - PLAID_CLIENT_ID              # provider-sync worker ONLY — the sole code-layer holder. NOT the V1 web-app container and NOT workers/etl (F/CTO 2026-09-09; ADR-011 D17/Lock 13 amendment of the same date moved the Plaid scheduled-poll into provider-sync). Declaring either Plaid name on any other surface is a confinement violation, not a completeness fix. ⚠ NO CI FENCE WATCHES THE CONFINEMENT — `.github/workflows/` and `scripts/ci/` contain zero `PLAID_*` references, and `check-secrets-nonoverlap.py` enforces ci_only/production_only DISJOINTNESS ONLY, never per-container placement (the ci_only pair is deliberately distinct-named — `PLAID_SANDBOX_*` — so it cannot trip either). The control is the per-surface `.env.example` enumeration plus Sec joint review.
  - PLAID_SECRET                 # provider-sync worker ONLY — same scope, same rationale, same absent fence as PLAID_CLIENT_ID above.
  # (No PLAID_WEBHOOK_SECRET: Plaid v27 webhook verification is asymmetric ES256/JWK
  #  via the worker's public-key fetch — NOT a static HMAC secret. A committed secret
  #  that gates nothing implies a control that does not exist, so none is declared.)
  - SIMPLEFIN_TOKEN              # provider-sync worker (SimpleFIN FALLBACK access token/URL per ADR-027 gate (i); see workers/provider-sync/.env.example)
  - WORKER_ADMISSION_SHARED_SECRET  # SELF-212 Option-C admission-endpoint shared secret (C6-2). 256-bit (`openssl rand -hex 32`). SAME value on BOTH V1 web-app (api/ relay tier) + provider-sync worker; provisioned as an ordinary per-application env var pushed IDENTICALLY to both `app` and `provider-sync` in one invocation of scripts/push-production-secrets.sh (ratified 2026-09-10, PR #738) — NOT a Coolify project-scoped SHARED var: Coolify's SharedEnvironmentVariable feature is dashboard/Livewire-only with no public REST endpoint, so the single-dashboard-edit-point mechanism is not scriptable and the identical-value-on-both-tiers REQUIREMENT is instead met by the co-push. NOT SUPABASE_SERVICE_ROLE_KEY — RT-26 §4.1 allowlist UNCHANGED (worker stays off it: direct-Postgres PFIN_DB_PASSWORD transport). Endpoint check is constant-time + fail-closed on absent/mismatch (Sec CA-6; Backend/worker owns). Rotatable: edit the operator .env once and re-run push-production-secrets.sh --apply (the single rotation edit point — it re-pushes both tiers in one invocation) → coordinated restart of BOTH tiers; NEVER hand-edit one side's Coolify env store alone, and drift between the two tiers → admission DENIED (fail-closed, never a bypass). production_only, disjoint from ci_only. (A CI analogue WORKER_ADMISSION_SHARED_SECRET_TEST belongs in ci_only ONLY if a live-endpoint integration test needs it — not required by the config-lint golden fixtures.)
  - DISCORD_WEBHOOK_URL          # V1 web-app / Coolify control plane / provider-sync worker / workers/etl monthly_report cron (SELF-351 A7; notify_discord.py — Gate F operator-only run success/failure notice, PM A-14). Fourth consumer of this SAME name, not a new secret; existing rotation/scope posture unchanged.
  - PFIN_DB_PASSWORD             # ETL + provider-sync worker — SAME secret NAME, DIFFERENT credential VALUES per container: ETL's value = the credential of its OWN dedicated login role `pfin_etl` (NOINHERIT LOGIN, member of `service_role` + `authenticated`; F/CTO-ratified 2026-08-02 over the alternative of sharing provider-sync's `authenticator`, SELF-214 Sec finding B8); provider-sync's value PRE-CUTOVER = the `authenticator` credential (login AS authenticator, writes AS service_role via SET LOCAL ROLE per ADR-023) — migration 116 provisions provider-sync's OWN dedicated login role `pfin_provider_sync` (NOINHERIT LOGIN, member of `service_role` + `authenticated`, mirroring `pfin_etl`), and once docs/deployment-runbook.md §6.2's deploy-time handoff runs, provider-sync's value becomes THAT role's own independently-rotatable credential, no longer the `authenticator`/PostgREST credential. Until §6.2 cutover runs, provider-sync still shares `authenticator` and the C1 rotation coupling below still binds it to PostgREST. ROTATION BOUNDARY — ADR-023's C1 coupling covers PostgREST + provider-sync PRE-CUTOVER ONLY; `pfin_etl` rotates INDEPENDENTLY (`\password pfin_etl` + ETL container restart; no PostgREST/provider-sync downtime), and provider-sync joins it in independent rotation once §6.2 cutover runs (`\password pfin_provider_sync` + provider-sync container restart only, no PostgREST redeploy). ⚠ ATTRIBUTION UNDER CORRECTION (Sec joint-review, PR #671, 2026-09-08): ADR-041 attaches the label to the rotation coupling in several paragraphs (no count recorded here — an earlier draft's fixed-count enumeration was measured at four paragraphs / seven occurrences); ADR-023's own enumerated C1 is a different condition. The label is mis-attributed, not unsupported. The label is NOT re-attributed here — that waits on F/CTO's ruling on ADR-019 (BACKLOG §7.36 item 4); only the false "IS the authenticator credential" scope statement above is corrected. That independent revocability is the whole point of the dedicated role: a compromised batch container is revoked without downing the public data API. DEPLOY-TIME HANDOFF — the migration creates `pfin_etl` NOLOGIN and WITHOUT a password (a credential must never sit in the repo); at deploy an operator runs TWO statements IN ORDER: `\password pfin_etl` (psql meta-command — prompts, hashes client-side) THEN `ALTER ROLE pfin_etl LOGIN;`. `pfin_provider_sync` follows the IDENTICAL two-step (migration 116; docs/deployment-runbook.md §6.2), in the SAME Phase-7 deploy pass. The single-statement `ALTER ROLE … WITH LOGIN PASSWORD '…'` form is PROHIBITED — wherever statement logging is on it writes the credential to the server log in cleartext. Generate with `openssl rand -hex 32` (256-bit). Until both statements run for a given role it CANNOT authenticate — fail-closed, but "role exists" ≠ "the container can connect". Full procedure + claim boundaries: docs/deployment-runbook.md §6.1 (`pfin_etl`; migration 055 is canonical if they disagree) / §6.2 (`pfin_provider_sync`; migration 116 is canonical if they disagree). Both TBC-bound per Lock 13 mod #3 (TenantBoundConnection in workers/etl/, TenantBoundClient in workers/provider-sync/; see per-container .env.example). Non-overlap invariant unaffected — one production_only entry; PFIN_DB_USER is a non-secret username whose VALUE differs per container — THREE distinct values in the target end-state (`authenticator` for PostgREST itself, `pfin_etl`, and `pfin_provider_sync` post-§6.2-cutover; provider-sync reads `authenticator` pre-cutover).
  - FMP_API_KEY                  # ETL (security-price ingest)
  - BLS_API_KEY                  # ETL (CPI-U ingest; see workers/etl/.env.example BLS discrepancy note)

  # --- Self-hosted Supabase stack's own secrets (infra/supabase/docker-compose.yml) ---
  # Sec-flagged 2026-09-10 (relayed via team-lead): these seven names were entirely
  # undeclared here even though the stack has been live since §4 stood it up. Not a
  # non-overlap violation (no name below collides with ci_only) -- but this file's
  # invariant is checked by scripts/ci/check-secrets-nonoverlap.py against the
  # DECLARATION, so an undeclared secret is invisible to it: a future name collision
  # on any of these seven would pass the fence green while actually violating the
  # invariant it exists to catch. Additive only -- no value ever recorded here.
  - POSTGRES_PASSWORD            # Supabase stack's `db` container -- the cluster superuser/`postgres` role password. Consumed internally by auth/rest/supavisor's own DSNs (${POSTGRES_PASSWORD} in infra/supabase/docker-compose.yml) and by whoever runs §6's `supabase db push` against $PROD_DB_URL. Same secret NAME as the ETL/provider-sync entry above is NOT this -- that one is PFIN_DB_PASSWORD (a login-role password on the SAME cluster, deliberately a different name; do not conflate the cluster superuser credential with either worker's scoped login-role credential).
  - JWT_SECRET                   # Supabase stack -- signs/verifies every GoTrue-issued JWT (including the ANON_KEY/SERVICE_ROLE_KEY pair below, which are JWTs minted FROM this secret, not independent credentials). The single highest-blast-radius secret in this stack: possessing it lets an attacker forge any role's JWT, including service_role.
  - SECRET_KEY_BASE              # Supabase stack -- `supavisor`'s own Phoenix SECRET_KEY_BASE (session/cookie signing for its Elixir/Phoenix runtime). Corrected 2026-09-10 (Sec, verified independently via `awk` over the service blocks before applying): an earlier draft of this comment attributed it to GoTrue/`auth` -- `auth` carries no such variable. Distinct from JWT_SECRET (that signs API-bearer JWTs everywhere in the stack; this is Supavisor-internal only).
  - VAULT_ENC_KEY                # Supabase stack -- `supavisor`'s own encryption key for the tenant/pooler credentials it stores in its `_supabase` metadata database. Corrected 2026-09-10 (Sec, verified independently): an earlier draft of this comment claimed this was `db`'s Postgres `vault` extension key protecting `vault.secrets` (where Plaid access tokens land) -- it is NOT. That extension's key lives inside Postgres itself and is not supplied by any compose env var; there is no `VAULT_ENC_KEY` reference in the `db` service block. This distinction matters in both directions: rotating this variable does not touch Plaid-token-at-rest protection, and an incident scoped against "VAULT_ENC_KEY compromised" should NOT be read as "vault.secrets exposed."
  - SERVICE_ROLE_KEY             # Supabase stack's OWN env name for the same minted JWT value the app consumes as SUPABASE_SERVICE_ROLE_KEY (declared above, RT-26 ARCH §4.1-allowlist-confined on the app side). SAME VALUE, TWO NAMES, TWO CONSUMERS (the stack's own auth/rest/supavisor containers vs. the V1 web-app) -- rotating one without the other breaks whichever side wasn't updated; there is no declared tie between the two names before this entry, which is exactly the gap Sec flagged.
  # (No SUPABASE_SECRET_KEY / SUPABASE_PUBLISHABLE_KEY: both carry `${VAR:-}` empty
  #  defaults in infra/supabase/docker-compose.yml -- upstream's newer publishable/
  #  secret key pair, unused while this stack mints ANON_KEY/SERVICE_ROLE_KEY as
  #  classic JWTs instead. Not declared because nothing populates them today.
  #  If SUPABASE_SECRET_KEY is ever given a value, it becomes a secret and belongs
  #  in this list -- SUPABASE_PUBLISHABLE_KEY would not, by the same reasoning as
  #  ANON_KEY above.)
  - ANON_KEY                     # Supabase stack's OWN env name for the same minted role:anon JWT the app consumes as PUBLIC_SUPABASE_ANON_KEY (see the non-secret classification note earlier in this file -- that reasoning applies identically here: RLS + the ADR-029 aal2 backstop are the controls, not confidentiality). DevOps call, not a Sec instruction (corrected 2026-09-10 -- an earlier draft of this comment attributed the decision to Sec; Sec's actual ask concerned STUDIO_DEFAULT_ORGANIZATION/STUDIO_DEFAULT_PROJECT and this file's general silence about the stack, not this specific entry). Declared here for discoverability/rotation-tie completeness, not because this stack-side name carries a different security posture than the app-side one. ⚠ CONSEQUENCE: this `production_only` entry now forbids a `ci_only: ANON_KEY` by the non-overlap invariant -- if a CI job ever needs a locally-minted anon key, name it `ANON_KEY_TEST` per this file's existing `_TEST` convention (see BLS_API_KEY_TEST above), never delete this entry to make room.
  - DASHBOARD_PASSWORD           # Supabase stack -- LIVE consumer, verified in infra/supabase/volumes/api/envoy/{docker-entrypoint.sh,lds.template.yaml}: docker-entrypoint.sh SHA1-hashes it into an htpasswd-style credential substituted into `${DASHBOARD_BASIC_AUTH}`, which Envoy's basic_auth filter applies across its route config at container start. Consumed by `api-gw` regardless of the `studio`/`meta` service trim (§4's service-scope table) -- this is the gateway's own template, not a Studio-specific credential. Paired with `DASHBOARD_USERNAME` (not declared here -- non-secret, but the entrypoint needs both to build the credential; set alongside this one).
  - PG_META_CRYPTO_KEY           # Supabase stack -- `meta`'s (postgres-meta) at-rest encryption key for connection strings it manages, and `studio`'s own copy of the same value (STUDIO_PG_META_URL round-trip). Both `studio` and `meta` came IN with F/CTO's 2026-09-10 Studio keep-ruling (Sec-ruled exposure shape: infra/supabase/README.md "Studio exposure shape"). ⚠ CHECKED LIVE 2026-09-10, NOT YET MINTED: `PG_META_CRYPTO_KEY` is absent from the eepvlmaq4uortakmido7jgvn Coolify application's env vars (88 vars checked by name only, via the v1 API -- no value read). Reservation, not provisioning, per this file's own discipline -- mint with `openssl rand -hex 32` before the Studio/meta deploy that consumes it, or `meta`/`studio` will fail to start on a missing required var.

  # SMTP_PASS added 2026-09-11 (F/CTO ask, relayed via team-lead) -- separate from
  # the eight-entry Sec-flagged batch above; this one is newly declared, not
  # previously-live-but-undeclared. docs/email-smtp-runbook.md (Auth-1 · SELF-290)
  # documents the full outbound-auth-email setup and already instructed, at its own
  # step 3, "add the entry to secrets-manifest.yml -- Sec-review as a new prod
  # secret" -- this is that entry, landing on the SAME PR as the discoverability
  # fixes that pointed the main deployment runbook and provision-supabase-stack.sh
  # at that email runbook, per Sec joint-review discipline for any manifest change.
  - SMTP_PASS                    # Supabase stack's `auth`/GoTrue container -- outbound auth-email SMTP credential (Resend API key, V1 default per docs/email-smtp-runbook.md; Amazon SES documented there as the alternative, IAM-derived SMTP password). scripts/provision-supabase-stack.sh's mint-if-absent step sets a NON-FUNCTIONAL PLACEHOLDER value ("fake_mail_password") purely so `auth` can start at all (GoTrue FATALs on an unparseable SMTP_PORT, not on a fake SMTP_PASS) -- it never overwrites a real value once an operator sets one by hand in Coolify per the email runbook. The OTHER SMTP_* vars this stack needs (SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_SENDER_NAME, SMTP_ADMIN_EMAIL) are non-secret provider config, deliberately NOT declared here -- same reasoning as SUPABASE_ANON_KEY/PUBLIC_SUPABASE_ANON_KEY and STUDIO_DEFAULT_ORGANIZATION/STUDIO_DEFAULT_PROJECT elsewhere in this file: this manifest's two lists enumerate confidential values, and a non-secret name here would assert a blast radius that does not exist.

  # ADR-072 (Option E) -- the migrator service's own credential. A NEWLY DECLARED
  # entry (not a previously-live-but-undeclared gap like the eight above), landing
  # in this same block because it is provisioned the SAME way -- minted into this
  # SAME Coolify Compose resource's shared env store by
  # scripts/provision-supabase-stack.sh -- not because it predates this PR.
  - MIGRATOR_DB_PASSWORD         # ADR-072 (Option E) Decision 4 / Sec C7/C8 — the `migrator` service's OWN standing DDL credential.
                                 #   Confined to the `migrator` container's env ONLY (infra/supabase/docker-compose.yml;
                                 #   infra/supabase/migrator/.env.example) — never CI, never the `app` container, never any other
                                 #   worker. A DISTINCT name and a DISTINCT role from `POSTGRES_PASSWORD` (cluster superuser) and
                                 #   `PFIN_DB_PASSWORD` (the pfin_etl / pfin_provider_sync worker-login credentials, entirely
                                 #   different roles for entirely different containers) — do not conflate any of the three. The
                                 #   `migrator` role itself is CREATEROLE + owner of the app database, NOT `postgres`, NOT
                                 #   `authenticator`, NOT a `pfin_*` role, and NOT a member of `service_role`/`authenticated` (Sec
                                 #   C8 — PG17's CREATEROLE-confined-to-self-created-roles semantics make the privilege-escalation
                                 #   concern moot; see ADR-072 Decision 4). ⚠ PROVISIONING — the `migrator` service is a SIBLING
                                 #   within infra/supabase/docker-compose.yml, the SAME Coolify Compose resource (one UUID, one
                                 #   shared env store) as `db`/`auth`/`rest`/`supavisor`, NOT a standalone Coolify application like
                                 #   `etl`/`pdf-render`/`provider-sync`. It is therefore minted/injected by
                                 #   scripts/provision-supabase-stack.sh's MINT_SECRETS (mint-if-absent, `openssl rand -hex 32`
                                 #   equivalent, 32 bytes) alongside POSTGRES_PASSWORD/JWT_SECRET/etc — NOT by
                                 #   scripts/push-production-secrets.sh's per-worker SECRET_RESOURCE_MAP (that script's KNOT 2
                                 #   already excludes every Supabase-stack-resident secret for exactly this reason; this is a 10th
                                 #   member of that same exclusion set, not a new push-production-secrets.sh entry). Standing-posture
                                 #   note (accepted, ADR-072 Consequences): unlike `pfin_etl`/`pfin_provider_sync` (NOLOGIN until an
                                 #   operator flips LOGIN post-migration), this credential is held AT REST by a resident, triggerable
                                 #   service 24/7 — the cost ADR-072 explicitly accepts in exchange for a bounded (non-superuser)
                                 #   role. Migrator-role BOOTSTRAP mechanism (migration vs. operator step) is an OPEN QUESTION
                                 #   flagged for Architect at the PR that adds this entry — see infra/supabase/migrator/.env.example.
