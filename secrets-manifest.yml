# secrets-manifest.yml — CI / production secret NON-OVERLAP commitment.
# Phase 5 Step 8 (DevOps-owned; Sec-consult mandatory at lock per WORKFLOW.md).
#
# ┌─ INVARIANT (machine-enforced; fail-closed) ────────────────────────────────┐
# │ No secret NAME may appear in BOTH `ci_only` and `production_only`.          │
# │ A leaked CI secret must NEVER grant production access, and a leaked         │
# │ production secret must NEVER reach CI — the two sets are disjoint by         │
# │ construction (blast-radius containment).                                    │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# Enforced by scripts/ci/check-secrets-nonoverlap.py, run as the
# `secrets-nonoverlap` job in .github/workflows/security-scan.yml on every PR +
# push to main. The check fails closed if: the manifest is missing/malformed,
# either set is absent/not-a-list, a name is duplicated within a set, or the
# intersection of the two sets is non-empty.
#
# DISCIPLINE — distinct-naming rule: any CI/test analogue of a production secret
# MUST take a DISTINCT name (e.g. PLAID_SANDBOX_SECRET, *_TEST). That distinct
# naming is the mechanism that keeps the two sets disjoint. Never reuse a
# production secret name for a sandbox/golden-fixture value.
#
# DISCIPLINE — reservation ≠ provisioning: a `ci_only` entry is a NAME RESERVATION,
# not a provisioning trigger. The value lands in the GitHub Actions secret store
# when a CONSUMER EXISTS; a credential sitting in a store nothing reads can leak
# but cannot help. Because of that, an entry that only reserves a name MUST also
# record whether a distinct non-production value EXISTS and who holds it.
# Otherwise "reserved" reads as "there is nothing to use", and whoever later wires
# the CI job finds no test secret in the store and reaches for the PRODUCTION one —
# which is the exact failure the reservation was made to prevent, reopening at
# provisioning time. Recording existence makes the reservation ACTIONABLE (there is
# something to ASK FOR) rather than aspirational (something to SUBSTITUTE for).
#
# SCOPE NOTE (flagged for Sec joint-review): as of Phase 5 the live GitHub Actions
# runs are credentials-free — db-tests.yml uses a local Supabase stack with a
# hardcoded local DSN (not a secret), the RT-15 replay-parity fixtures use no live
# API/creds, and gitleaks uses only the GitHub-native GITHUB_TOKEN. The `ci_only`
# entries below are therefore RESERVED distinct names (the contract that future CI
# integration tests must follow), not all yet provisioned as live GitHub secrets.
# GITHUB_TOKEN is intentionally EXCLUDED — it is GitHub-native, not a project
# secret (per the existing security-scan.yml gitleaks-job rationale).
#
# ┌─ THIRD TIER — LOCAL DEVELOPMENT: NAMED HERE, AND EXPLICITLY NOT COVERED ────┐
# │ Beyond the CI store and the production store there is a THIRD tier: the      │
# │ credentials on a developer's own machine — `.env` files, shell history,      │
# │ editor state, keychains.                                                     │
# │                                                                              │
# │ THE NON-OVERLAP INVARIANT DOES NOT REACH THIS TIER, AND CANNOT. The          │
# │ invariant at the top of this file is stated over what enters the CI store    │
# │ and what enters the production store. A developer's `.env` is NEITHER of     │
# │ those stores, so no invariant stated over the two can bind it, and the       │
# │ `secrets-nonoverlap` job cannot observe it. There is no fence here.          │
# │                                                                              │
# │ ⚠ Read that as SCOPE, NOT as unimportance. Local dev is the tier where       │
# │ credentials ACTUALLY SIT ON A MACHINE — exposed to backups, screen shares,   │
# │ laptop loss and accidental commits. On exposure it is the HIGHEST tier, not  │
# │ the lowest. This paragraph exists because both shorter framings mislead:     │
# │ omitting local dev implies it does not matter, and naming it without stating │
# │ the non-reach implies this manifest covers it. Neither is true.              │
# │                                                                              │
# │ The substituted discipline — convention and review, NOT machine-enforced:    │
# │  1. `.env` files are gitignored and never committed. gitleaks is a BACKSTOP  │
# │     against the commit, not a control over the credential on disk.           │
# │  2. Local runs use the non-production value under its DISTINCT *_TEST /      │
# │     *_SANDBOX_* name. Borrowing a production credential for a local run is   │
# │     a VIOLATION even though nothing here can detect it. It happened on       │
# │     2026-08-09 with BLS_API_KEY — no test analogue existed, so the only key  │
# │     at hand was production's. That is why BLS_API_KEY_TEST is now reserved.  │
# │  3. Production secret NAMES should be ABSENT from developer machines, so     │
# │     that the name a value is stored under still carries its tier. Where a    │
# │     loader accepts only the production name, that convention SNAPS at the    │
# │     loader boundary and the fix belongs in the loader, not in convention:    │
# │     a `BLS_API_KEY_TEST` override for the ETL param loader is routed to      │
# │     Backend alongside the BACKLOG.md §7.6 S12 loader change. It would let a  │
# │     developer's `.env` hold the test key under the TEST name with the        │
# │     production name absent entirely — auditable BY SHAPE rather than by      │
# │     trust. Still not a fence; CI cannot verify a developer's machine.        │
# └──────────────────────────────────────────────────────────────────────────────┘
#
# Anchors: ARCH §5 (per-container secret surface) · ADR-002 §6.0 (secrets
# discipline) · SECURITY RT-26 (SERVICE_ROLE_KEY) · SD-20 (PDF signing key) ·
# ADR-011 Lock 13 mod #2 (PDF worker zero-DB).

version: 1

# CI-only — exist ONLY in GitHub Actions; test / sandbox / golden-fixture values
# with NO production reach. Distinct-named analogues of production secrets.
ci_only:
  - PLAID_SANDBOX_CLIENT_ID      # Plaid sandbox tier for QA integration fixtures (≠ prod PLAID_CLIENT_ID)
  - PLAID_SANDBOX_SECRET         # Plaid sandbox secret (≠ prod PLAID_SECRET)
  - PDF_WORKER_SIGNING_KEY_TEST  # golden test key for PDF-JWT fixtures (≠ prod PDF_WORKER_SIGNING_KEY)
  - SIMPLEFIN_TOKEN_TEST         # SimpleFIN demo/test bridge token for QA fixtures (≠ prod SIMPLEFIN_TOKEN)
  - BLS_API_KEY_TEST             # Non-production BLS registration key for CI and local CPI-U runs (≠ prod BLS_API_KEY). Per ADR-048 rider 2.
                                 #   ⚠ NOT justified on confidentiality, and a reader who objects on that ground is RIGHT: the BLS key
                                 #   is a RATE-LIMIT LIFT, not an access credential — a keyless v1 endpoint serves the same public CPI
                                 #   data (v1: 25 queries/day; v2 keyed: 500). Writing "protect the BLS secret" here would be a claim a
                                 #   future reader can correctly refute, and refuting it would reopen the borrow. The two real reasons:
                                 #   (i) AVAILABILITY COUPLING — production's v2 daily quota is a SHARED, EXHAUSTIBLE resource; a CI or
                                 #   local run spending it degrades the nightly CPI ingest that depends on it, and a backfill re-run is
                                 #   itself quota-priced (ADR-048: the documented recovery action is the one the quota forbids).
                                 #   (ii) KEEPING NON-OVERLAP TRUE IN PRACTICE RATHER THAN BY LUCK — with no test-named analogue, the
                                 #   only BLS key at hand is the production one, so non-overlap holds only until someone needs to run
                                 #   the ingest. On 2026-08-09 a local verification run borrowed the production credential for exactly
                                 #   that reason. The disjointness this file asserts is only worth what the alternative is.
                                 #   EXISTENCE (the fact, never the value): a DISTINCT non-production BLS key EXISTS and is HELD BY
                                 #   F/CTO — registered 2026-08-09 (free, self-service), its value verified distinct from production
                                 #   out of band and recorded as an assertion of that date; the two values were never placed anywhere
                                 #   comparable, and neither appears in this repo. Recorded per the reservation ≠ provisioning rule
                                 #   above so the eventual CI wiring has something to ASK F/CTO FOR, not something to substitute.
                                 #   NOT PROVISIONED as a live GitHub Actions secret: no CI job consumes BLS today, and a credential in
                                 #   a store where nothing reads it can leak but cannot help. Provision at first consumer.

# Production-only — real credentials Coolify-injected on the V1 production VPS at
# deploy time (greenfield per ADR-021; the cax21/pfindash.com incumbent is
# reference-only, NOT the deploy target); NEVER present in GitHub Actions.
# Enumerated from the ARCH §5 per-container secret surface.
production_only:
  - SUPABASE_ANON_KEY            # V1 web-app
  - SUPABASE_SERVICE_ROLE_KEY    # V1 web-app (RT-26 ARCH §4.1 allowlist only)
  - PDF_WORKER_SIGNING_KEY       # V1 web-app + PDF worker (SD-20)
  - PLAID_CLIENT_ID              # V1 web-app + ETL scheduled-poll + provider-sync worker
  - PLAID_SECRET                 # V1 web-app + ETL scheduled-poll + provider-sync worker
  # (No PLAID_WEBHOOK_SECRET: Plaid v27 webhook verification is asymmetric ES256/JWK
  #  via the worker's public-key fetch — NOT a static HMAC secret. A committed secret
  #  that gates nothing implies a control that does not exist, so none is declared.)
  - SIMPLEFIN_TOKEN              # provider-sync worker (SimpleFIN FALLBACK access token/URL per ADR-027 gate (i); see workers/provider-sync/.env.example)
  - WORKER_ADMISSION_SHARED_SECRET  # SELF-212 Option-C admission-endpoint shared secret (C6-2). 256-bit (`openssl rand -hex 32`). SAME value on BOTH V1 web-app (api/ relay tier) + provider-sync worker; provisioned as a Coolify project-scoped SHARED var (one rotation edit point) referenced by both services. NOT SUPABASE_SERVICE_ROLE_KEY — RT-26 §4.1 allowlist UNCHANGED (worker stays off it: direct-Postgres PFIN_DB_PASSWORD transport). Endpoint check is constant-time + fail-closed on absent/mismatch (Sec CA-6; Backend/worker owns). Rotatable: update the shared var → coordinated restart of BOTH tiers. production_only, disjoint from ci_only. (A CI analogue WORKER_ADMISSION_SHARED_SECRET_TEST belongs in ci_only ONLY if a live-endpoint integration test needs it — not required by the config-lint golden fixtures.)
  - DISCORD_WEBHOOK_URL          # V1 web-app / Coolify control plane / provider-sync worker
  - PFIN_DB_PASSWORD             # ETL + provider-sync worker — SAME secret NAME, DIFFERENT credential VALUES per container: ETL's value = the credential of its OWN dedicated login role `pfin_etl` (NOINHERIT LOGIN, member of `service_role` + `authenticated`; F/CTO-ratified 2026-08-02 over the alternative of sharing provider-sync's `authenticator`, SELF-214 Sec finding B8); provider-sync's value = the `authenticator` credential (coupled to PostgREST — C1 rotation coupling; login AS authenticator, writes AS service_role via SET LOCAL ROLE per ADR-023). ROTATION BOUNDARY — ADR-023's C1 coupling covers PostgREST + provider-sync ONLY; `pfin_etl` rotates INDEPENDENTLY (`\password pfin_etl` + ETL container restart; no PostgREST/provider-sync downtime). That independent revocability is the whole point of the dedicated role: a compromised batch container is revoked without downing the public data API. DEPLOY-TIME HANDOFF — the migration creates `pfin_etl` NOLOGIN and WITHOUT a password (a credential must never sit in the repo); at deploy an operator runs TWO statements IN ORDER: `\password pfin_etl` (psql meta-command — prompts, hashes client-side) THEN `ALTER ROLE pfin_etl LOGIN;`. The single-statement `ALTER ROLE … WITH LOGIN PASSWORD '…'` form is PROHIBITED — wherever statement logging is on it writes the credential to the server log in cleartext. Generate with `openssl rand -hex 32` (256-bit). Until both statements run the role CANNOT authenticate — fail-closed, but "role exists" ≠ "ETL can connect". Full procedure + claim boundaries: docs/deployment-runbook.md §6.1 (migration 055 is canonical if they disagree). Both TBC-bound per Lock 13 mod #3 (TenantBoundConnection in workers/etl/, TenantBoundClient in workers/provider-sync/; see per-container .env.example). Non-overlap invariant unaffected — one production_only entry; PFIN_DB_USER is a non-secret username whose VALUE now differs per container (`pfin_etl` vs `authenticator`).
  - FMP_API_KEY                  # ETL (security-price ingest)
  - BLS_API_KEY                  # ETL (CPI-U ingest; see workers/etl/.env.example BLS discrepancy note)
