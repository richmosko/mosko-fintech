[project]
name = "pfin_back_etl"
version = "0.2.4"
description = "Personal Finance Backend Extract/Transform/Load... Scripts to fetch datasets from external APIs, and tramsform them for populating the PFin database (SupaBase)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fmpstab>=0.2.0",
    "polars>=1.38.0",
    "psycopg2-binary>=2.9.11",
    "pyarrow>=23.0.0",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0.46",
]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
]
test = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[tool.ruff]
# Minimal ruff baseline (Phase 5 Step 8 — DevOps + Backend joint ETL surface).
# target-version is inferred from project.requires-python (>=3.14); not pinned here.
# Backend may broaden rule selection without DevOps sign-off; this is the floor.
src = ["src", "tests"]

[tool.ruff.lint]
# Conservative starting set = ruff's default family (E4/E7/E9 pycodestyle + F
# pyflakes). Deliberately avoids imposing style churn (import-sort / line-length)
# on the incumbent ETL code; broaden (I/UP/B/...) at Backend's discretion.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast tests with no external dependencies (no DB, no API)",
    "integration: tests that require database and/or API connections",
    "deployment: tests that replicate actual deployment function calls",
    "replay: deterministic tests using synthetic record-replay fixtures (no live API, no creds; RT-15 parity)",
    "pgtest: needs a real Postgres but NO credentials and NO project schema (temp tables only) — CI-runnable with zero secrets",
]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-v",
]
log_cli = true
log_cli_level = "INFO"
