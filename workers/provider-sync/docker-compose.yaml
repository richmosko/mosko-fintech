# fence-admission-private-bind: target
# workers/provider-sync/docker-compose.yaml
#
# Coolify **Compose build-pack** manifest for the provider-sync worker (SELF-212
# Option C, b-i per F/CTO ratify + Sec CA-3). Adopting a committed compose — vs.
# the Dockerfile+Base-Directory build pack — is what makes the SELF-212 admission
# endpoint's network-exposure surface COMMITTED and therefore LINTABLE by
# scripts/ci/fence-admission-private-bind.sh (limb (b) of C6-1). Precedent:
# workers/etl/docker-compose.yaml.
#
# ┌─ ADMISSION ENDPOINT — INTERNAL-ONLY BY CONSTRUCTION (C6-1 / RT-27) ─────────┐
# │ The SELF-212 app→worker admission HTTP endpoint (leg-1 link_token mint +     │
# │ leg-2 public_token exchange+admit) is reachable ONLY over the shared Coolify │
# │ PROJECT Docker network, via the service name `http://provider-sync:8081`.    │
# │                                                                              │
# │ ENFORCED HERE by the ABSENCE of two things (fence-admission-private-bind      │
# │ fails closed if either appears):                                             │
# │   1. NO published host-port mapping (`ports:`) — only `expose:` (internal).  │
# │      `expose:` grants sibling-container reach on the project network; it does │
# │      NOT publish to the host/public internet. That is the whole point.       │
# │   2. NO reverse-proxy Domain / Traefik `Host()` label / Coolify `SERVICE_FQDN`│
# │      magic requesting a public FQDN for this service.                        │
# │                                                                              │
# │ The UI-added-Domain vector (which a committed lint CANNOT see) is covered by  │
# │ the worker's startup public-route env tripwire (limb (a), Backend-owned) +    │
# │ the deploy-time external-reachability negative smoke (CA-2, runbook §10).     │
# │ Multi-layer per Sec CA-3 — do not collapse to a single layer.                │
# │                                                                              │
# │ CA-4 PREREQUISITE, RESTATED CORRECTLY (ADR-073, 2026-09-19 — the           │
# │ "same Coolify project" premise this paragraph previously stated is         │
# │ FALSIFIED; corrected in place here, not silently): this service AND the   │
# │ api/ web-app MUST be attached to the SAME DOCKER NETWORK, or               │
# │ `http://provider-sync:8081` does not resolve. Coolify project/environment  │
# │ membership grants NO attachment at all — the reach comes from the          │
# │ `external:` network block below, naming the Supabase stack's own network   │
# │ by name (the SAME network api/docker-compose.yaml attaches `app` to).      │
# │ Cross-network placement breaks internal reach AND tempts a public-Domain   │
# │ "fix" — the exact regression §10 fences. See runbook §3/§7.               │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# fence-provider-sync-private-bind: target
#
# NETWORK ATTACHMENT — BACKLOG.md §7.36 item 68 (F/CTO-ruled fleet
# convention, 2026-09-19). This service also needs DIRECT-Postgres reach to
# `db` (TenantBoundClient, login role authenticator/pfin_provider_sync post-
# §6.2 cutover) — the SAME stack-network attachment discharges both the CA-4
# app-reachability prerequisite above AND the DB-reach dependency, because
# `app` is attached to that same stack network too (api/docker-compose.yaml).
# PROVIDER_SYNC_STACK_NETWORK_NAME is its OWN uniquely-named var (same
# per-resource-name discipline as MIGRATOR_STACK_NETWORK_NAME /
# APP_STACK_NETWORK_NAME), populated by scripts/provision-worker.sh
# pfin-provider-sync.
#
# TRANSPORT posture is UNCHANGED from the Dockerfile: direct-Postgres via
# TenantBoundClient (PFIN_DB_*, login role authenticator), OFF the RT-26 allowlist
# (no SUPABASE_SERVICE_ROLE_KEY, no @supabase/supabase-js — fence-tbc-node enforces).
#
# SECRETS: Coolify-injected at RUNTIME (deploy-time, greenfield VPS per ADR-021).
# NONE are literals here. `${VAR}` references document the contract; Coolify
# substitutes the real values from the service/project env at deploy. See
# workers/provider-sync/.env.example + secrets-manifest.yml (production_only).

services:
  provider-sync:
    container_name: provider-sync
    build: .
    restart: unless-stopped
    # INTERNAL-ONLY admission port. `expose:` = reachable to sibling containers on
    # the project network; NOT host-published. NEVER convert this to a `ports:`
    # mapping (fence-admission-private-bind fails closed on `ports:`).
    expose:
      - "8081"
    environment:
      - NODE_ENV=production
      # --- SELF-212 admission endpoint (Option C) ---
      # ADMISSION_PRIVATE_ONLY: affirmative fail-closed opt-in consumed by the
      # worker's limb-(a) startup assertion. Unset/not-"true" → worker refuses to
      # serve the admission listener (Backend-owned). Non-secret literal.
      - ADMISSION_PRIVATE_ONLY=true
      - ADMISSION_PORT=8081
      # ADMISSION_HOST: in-container bind host. 0.0.0.0 is REQUIRED for sibling
      # reach over the internal Docker network (CAVEAT-2) — the bind address is NOT
      # the exposure control; the absence of ports:/Domain above is. Consumed by
      # admissionConfig.ts (default 0.0.0.0); set explicitly here for contract clarity.
      - ADMISSION_HOST=0.0.0.0
      # WORKER_ADMISSION_SHARED_SECRET (C6-2): 256-bit shared secret, SAME value on
      # api/ web-app + this worker; Coolify project-scoped shared var (one rotation
      # edit point). production_only (secrets-manifest.yml); NEVER a literal here.
      - WORKER_ADMISSION_SHARED_SECRET=${WORKER_ADMISSION_SHARED_SECRET}
      # --- pfin direct-Postgres transport (authenticator; writes AS service_role) ---
      - PFIN_DB_HOST=${PFIN_DB_HOST}
      - PFIN_DB_PORT=${PFIN_DB_PORT}
      - PFIN_DB_NAME=${PFIN_DB_NAME}
      - PFIN_DB_USER=${PFIN_DB_USER}
      - PFIN_DB_PASSWORD=${PFIN_DB_PASSWORD}
      # --- Plaid (PRIMARY; required at boot per loadConfig()) ---
      - PLAID_ENV=${PLAID_ENV}
      - PLAID_CLIENT_ID=${PLAID_CLIENT_ID}
      - PLAID_SECRET=${PLAID_SECRET}
      # --- SimpleFIN (FALLBACK; admit entrypoint) ---
      - SIMPLEFIN_TOKEN=${SIMPLEFIN_TOKEN}
      # --- Notification routing ---
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      # --- SELF-279 CA-2 recurring reachability probe (NON-secret config) ---
      # ADMISSION_PROBE_PUBLIC_URLS: comma-separated PUBLIC https FQDNs the @daily poll's
      # folded-in reachability probe GETs (presence ⇒ enabled; unset/empty ⇒ logged no-op,
      # fail-SAFE — never fails the poll). NON-secret (public URLs by definition) → NOT in
      # secrets-manifest.yml; the CI/prod non-overlap fence is UNAFFECTED. Coolify-injected,
      # DevOps-pinned per Note N4 (pin the `<service>-<hash>.<wildcard>` Coolify pattern + the
      # project apex). Entries must be bare https FQDNs — no query-string / no embedded creds
      # (the URL is echoed into the Discord alert; Note N1). Unset in Coolify ⇒ ${...} expands
      # empty ⇒ probe no-ops (fail-safe preserved).
      - ADMISSION_PROBE_PUBLIC_URLS=${ADMISSION_PROBE_PUBLIC_URLS}
      # ADMISSION_PROBE_CONFIRM_ROUTE: optional 401-confirmation route probe; OFF by default
      # (Sec ruling — /healthz-fingerprint-only ships in v1). Non-secret literal.
      - ADMISSION_PROBE_CONFIRM_ROUTE=false
      # ADMISSION_PROBE_TIMEOUT_MS (per-URL probe timeout ms, code default 5000): DELIBERATELY
      # NOT declared here. env.ts parses it as z.coerce.number().int().positive().default(5000),
      # and .default() fires ONLY on `undefined`. A `${ADMISSION_PROBE_TIMEOUT_MS}` reference to an
      # UNSET Coolify var would expand to "" ⇒ coerces to 0 ⇒ fails .positive() ⇒ worker BOOT CRASH.
      # Omitting the line keeps the key genuinely undefined so the 5000 code default stands. To
      # override, add it in Coolify with an explicit POSITIVE INTEGER value (never blank). Contract
      # documented in .env.example. (Contrast ADMISSION_PROBE_PUBLIC_URLS: z.string().optional()
      # accepts "" safely, so a ${...} ref is fine there — only the coerced-number key has this trap.)
    networks:
      - default

# Top-level network definition for the `default` name the service above
# joins — ADR-073 mechanism (b): an `external:` network naming the
# Supabase-stack application's own Docker network. Discharges BOTH the CA-4
# app-reachability prerequisite (the same network `app` itself attaches to,
# api/docker-compose.yaml) AND the direct-Postgres `db` dependency — see the
# NETWORK ATTACHMENT header comment above.
networks:
  default:
    name: ${PROVIDER_SYNC_STACK_NETWORK_NAME:?PROVIDER_SYNC_STACK_NETWORK_NAME must be set to the Supabase-stack application's Docker network name -- measured at provisioning by scripts/provision-worker.sh pfin-provider-sync. Do NOT default this to a guessed value.}
    external: true
